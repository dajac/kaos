name: CI

on:
  # No branch filter: stacked PRs have a base other than main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs of a pull request; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Factory script tests
        run: scripts/factory/test/run.sh
      # The integration tests use the runner's Docker through Testcontainers.
      - run: ./mvnw -B -ntp verify
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
          if-no-files-found: ignore
