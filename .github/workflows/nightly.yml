name: Nightly

# Builds main every night and pushes the image ghcr.io/dajac/kaos with
# the tags nightly and nightly-YYYYMMDD. A scheduled run skips a main
# that has not changed since the last nightly; a manual run always builds.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read     # the runs of this workflow
      packages: write   # the image on ghcr.io
    steps:
      - name: Check for changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --branch main \
            --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "main is unchanged since the last nightly: nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.build == 'true'
        uses: actions/checkout@v7
      - if: steps.changes.outputs.build == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # The same build as CI, integration tests included; the version is
      # the SNAPSHOT of main.
      - if: steps.changes.outputs.build == 'true'
        run: ./mvnw -B -ntp verify
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
          if-no-files-found: ignore
      - if: steps.changes.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.changes.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.changes.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-{{date 'YYYYMMDD'}}
      - if: steps.changes.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
