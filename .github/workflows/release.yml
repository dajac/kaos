name: Release

# Pushing a tag vX.Y.Z releases version X.Y.Z:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # the GitHub release
      packages: write   # the image on ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # The POMs on main hold the next SNAPSHOT version; the tag sets the
      # released one, which also names the jar and `kaos --version`.
      - name: Set the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.23.0:set \
            -DnewVersion="$version" -DprocessAllModules -DgenerateBackupPoms=false
      # The same build as CI, integration tests included.
      - run: ./mvnw -B -ntp verify
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
          if-no-files-found: ignore
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags X.Y.Z, X.Y and latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          \`\`\`sh
          docker pull ${IMAGE}:${VERSION}
          \`\`\`
          NOTES
          jar="kaos-server/target/kaos-server-$VERSION.jar"
          # A re-run after a partial failure updates the existing release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$jar" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Kaos $VERSION" \
              --notes-file notes.md \
              --generate-notes \
              "$jar"
          fi

  # Moves main to the next minor SNAPSHOT once X.Y.Z is out, unless main
  # has moved already (a later release, or a patch release of an older
  # line).
  bump:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the push to main
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Move main to the next SNAPSHOT
        run: |
          released="${GITHUB_REF_NAME#v}"
          current="$(./mvnw -B -q -ntp org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate \
            -Dexpression=project.version -DforceStdout)"
          if [ "$current" != "$released-SNAPSHOT" ]; then
            echo "main is at $current, not $released-SNAPSHOT: nothing to bump"
            exit 0
          fi
          IFS=. read -r major minor _ <<< "$released"
          next="$major.$((minor + 1)).0-SNAPSHOT"
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.23.0:set \
            -DnewVersion="$next" -DprocessAllModules -DgenerateBackupPoms=false
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "build(build): Move main to $next"
          git push origin HEAD:main
