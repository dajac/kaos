name: Release

# Run from the Actions tab (Release, Run workflow) or with
# "gh workflow run release.yml [-f version=X.Y.Z]". It releases the head
# of the chosen branch, main by default or a release/* branch for a
# patch of an older line, and creates the tag vX.Y.Z.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z; empty takes the version of the POMs without -SNAPSHOT'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # the tag and the GitHub release
      packages: write   # the image on ghcr.io
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Choose the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          current="$(./mvnw -B -q -ntp org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate \
            -Dexpression=project.version -DforceStdout)"
          version="${INPUT_VERSION:-${current%-SNAPSHOT}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a version X.Y.Z"
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$version is already released"
            exit 1
          fi
          # latest moves only forward: a patch of an older line keeps it.
          newest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq '.[].tagName' | sed 's/^v//' | sort -V | tail -n 1)"
          if [ -z "$newest" ] || [ "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)" = "$version" ]; then
            latest=true
          else
            latest=false
          fi
          echo "Releasing $version from $GITHUB_REF_NAME at $GITHUB_SHA (latest: $latest)"
          {
            echo "version=$version"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
      # The POMs hold a SNAPSHOT version; the release sets X.Y.Z in this
      # checkout only, which also names the jar and `kaos --version`.
      - name: Set the version
        run: |
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.23.0:set \
            -DnewVersion="${{ steps.version.outputs.version }}" -DprocessAllModules -DgenerateBackupPoms=false
      # The same build as CI, integration tests included.
      - run: ./mvnw -B -ntp verify
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports
            **/target/failsafe-reports
          if-no-files-found: ignore
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags X.Y.Z and, for the newest release, latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.latest }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Creates the tag vX.Y.Z on the released commit, then the release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          cat > notes.md <<NOTES
          \`\`\`sh
          docker pull ${IMAGE}:${VERSION}
          \`\`\`
          NOTES
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kaos $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --latest="$LATEST" \
            "kaos-server/target/kaos-server-$VERSION.jar"

  # Moves main to the next minor SNAPSHOT once X.Y.Z is out, unless main
  # is already past X.Y.Z (a patch release of an older line).
  bump:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # the push to main
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Move main to the next SNAPSHOT
        env:
          RELEASED: ${{ needs.release.outputs.version }}
        run: |
          current="$(./mvnw -B -q -ntp org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate \
            -Dexpression=project.version -DforceStdout)"
          IFS=. read -r major minor _ <<< "$RELEASED"
          next="$major.$((minor + 1)).0"
          base="${current%-SNAPSHOT}"
          if [ "$(printf '%s\n%s\n' "$base" "$next" | sort -V | tail -n 1)" = "$base" ]; then
            echo "main is at $current, already at or past $next-SNAPSHOT: nothing to bump"
            exit 0
          fi
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.23.0:set \
            -DnewVersion="$next-SNAPSHOT" -DprocessAllModules -DgenerateBackupPoms=false
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "build(build): Move main to $next-SNAPSHOT"
          # A PR merged meanwhile makes the push non-fast-forward.
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
