name: Feature
description: A new capability or a change of behavior
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a user not do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you would like. Mockups for UI changes.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Optional. What is out of scope, the alternatives you thought of.
