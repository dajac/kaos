<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaos — Kafka Consumer Group Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e14;
  --surface: #12171f;
  --surface2: #1a2029;
  --surface3: #222a35;
  --border: #2a3342;
  --border-subtle: #1e2736;
  --text: #d4dce8;
  --text-muted: #6b7a8d;
  --text-dim: #4a5568;
  --accent: #4c9aff;
  --accent-dim: rgba(76,154,255,0.12);
  --green: #34d399;
  --green-dim: rgba(52,211,153,0.12);
  --yellow: #fbbf24;
  --yellow-dim: rgba(251,191,36,0.10);
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.10);
  --fault: #5cd5ff;
  --fault-dim: rgba(92,213,255,0.12);
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
  --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --sidebar-w: 280px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

/* ── Layout shell ── */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: 1fr;
  height: 100vh;
  gap: 0;
}

/* ── Sidebar ── */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

.sidebar-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
}

.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sidebar-header {
  flex: 0 0 auto;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
}

.sidebar-footer {
  flex: 0 0 auto;
  border-top: 1px solid var(--border);
}

.sidebar-brand {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
}

.sidebar-subtitle {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
  letter-spacing: 0.3px;
}

.sidebar-section {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
}

.sidebar-section:last-child {
  border-bottom: none;
}

.section-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-bottom: 10px;
}

/* ── Status line (in main header) ── */
.header-status {
  display: flex;
  align-items: center;
  gap: 12px;
}

.status-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.status-label {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}

.status-value {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
}

.status-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.status-badge.s-stable { background: var(--green-dim); color: var(--green); }
.status-badge.s-reconciling, .status-badge.s-assigning { background: var(--yellow-dim); color: var(--yellow); }
.status-badge.s-empty { background: rgba(107,122,141,0.12); color: var(--text-dim); }
.status-badge.s-idle { background: rgba(107,122,141,0.12); color: var(--text-dim); }
.status-badge.s-type {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
}

/* ── Form fields ── */
.field {
  margin-bottom: 8px;
}

.field:last-child { margin-bottom: 0; }

.field-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
  letter-spacing: 0.3px;
}

.field-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-family: var(--font-mono);
  transition: border-color 0.15s;
}

.field-input:focus {
  outline: none;
  border-color: var(--accent);
}

.field-input:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  background: var(--surface2);
}

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  border: none;
  cursor: pointer;
  transition: opacity 0.12s, background 0.12s;
  width: 100%;
}

.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn:active { transform: scale(0.98); }

.btn-start { background: var(--green); color: #0a0e14; }
.btn-stop { background: var(--red); color: #0a0e14; }

/* ── Auto-Pilot ── */
.btn-autopilot {
  width: 100%;
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--text-muted);
}

.btn-autopilot:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.btn-autopilot.active {
  background: var(--yellow-dim);
  border-color: rgba(251,191,36,0.3);
  color: var(--yellow);
}

/* ── Main area ── */
.main {
  overflow: auto;
  padding: 0;
  background: var(--bg);
}

.main::-webkit-scrollbar { width: 6px; height: 6px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ──────────────────────────────────────────────────────────────
   Bento card grid — each consumer is a self-contained card with
   a stacked "coordinator zone" (top) and "consumer zone" (bottom).
   The visible gap between zones makes server/consumer divergence
   a primary visual axis instead of a table-cell detail.
   ────────────────────────────────────────────────────────────── */
.card-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  padding: 14px;
  align-content: start;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  overflow: hidden;
  transition: border-color 0.25s, opacity 0.25s, box-shadow 0.3s;
  position: relative;
}

.card.stable { border-color: rgba(52,211,153,0.35); }
.card.reconciling {
  border-color: rgba(251,191,36,0.45);
  box-shadow: 0 0 0 1px rgba(251,191,36,0.12), 0 0 22px -8px rgba(251,191,36,0.4);
}
.card.stopping { border-color: rgba(248,113,113,0.4); }
.card.joining { border-color: rgba(76,154,255,0.45); }
.card.stopped { opacity: 0.45; }

/* Accent stripe down the left edge mirrors the member state. */
.card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--text-dim);
  transition: background 0.2s;
  z-index: 1;
}
.card.stable::before    { background: var(--green); }
.card.reconciling::before { background: var(--yellow); }
.card.stopping::before  { background: var(--red); }
.card.joining::before   { background: var(--accent); }
.card.stopped::before   { background: var(--text-dim); }

/* ── Left column: consumer metadata ── */
.card-meta {
  flex: 0 0 260px;
  padding: 14px 16px 14px 20px;
  background: var(--surface2);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.card-meta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.member-name {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  letter-spacing: 0.3px;
  flex-shrink: 0;
}

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  flex-shrink: 0;
}

.badge.stable { background: var(--green-dim); color: var(--green); }
.badge.reconciling { background: var(--yellow-dim); color: var(--yellow); }
.badge.stopping { background: var(--red-dim); color: var(--red); }
.badge.stopped { background: rgba(107,122,141,0.12); color: var(--text-dim); }
.badge.joining { background: var(--accent-dim); color: var(--accent); }

/* Labeled metadata line: "label  value" — used for id, instance, epoch. */
.meta-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  min-width: 0;
}

.meta-line-label {
  flex: 0 0 auto;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  opacity: 0.8;
  width: 56px;
}

.meta-line-value {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.meta-line-value.dim {
  color: var(--text-dim);
  opacity: 0.6;
  font-weight: 400;
}

/* ── Middle: shared-topic grid with coordinator + consumer columns ──
   Three columns: topic name | coordinator chips | consumer chips.
   A wider gap before the coordinator column visually separates the
   metadata section from the partition views. */
.zones {
  display: grid;
  grid-template-columns: auto 1fr 1fr;
  align-items: stretch;
  flex: 1 1 auto;
  min-width: 0;
  background: var(--bg);
  padding: 12px 16px;
  column-gap: 14px;
  row-gap: 0;
  align-content: start;
}

.zone-cell {
  padding: 4px 0;
  display: flex;
  align-items: flex-start;
}

.zone-cell.zone-cell-name {
  grid-column: 1;
  padding-right: 24px;
}

.zone-cell.zone-cell-server {
  grid-column: 2;
}

.zone-cell.zone-cell-consumer {
  grid-column: 3;
}

/* Header cells (one per column, in the first row of the grid). */
.zone-cell.zone-header {
  align-items: center;
  padding-top: 0;
  padding-bottom: 8px;
}

.zone-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.3px;
  color: var(--text-dim);
}

.zone-count {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  margin-left: auto;
  letter-spacing: 0.3px;
}

/* Subtle row separators between topics (not on the header row). */
.zone-cell.zone-row {
  border-top: 1px solid var(--border-subtle);
}

.zone-topic-name {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  line-height: 26px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.zone-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  flex: 1;
  min-height: 26px;
  align-items: flex-start;
  align-content: flex-start;
}

.zone-empty {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  font-style: italic;
}

.partition-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  padding: 0;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font-mono);
  flex: 0 0 auto;
  transition: background 0.25s, color 0.25s;
  box-sizing: border-box;
}

.partition-chip.assigned {
  background: var(--green-dim);
  color: var(--green);
  border: 1px solid rgba(52,211,153,0.25);
}

.partition-chip.pending-assignment {
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid rgba(76,154,255,0.3);
}

.partition-chip.pending-revocation {
  background: var(--yellow-dim);
  color: var(--yellow);
  border: 1px solid rgba(251,191,36,0.35);
}

/* ── Right column: per-consumer controls ── */
.member-controls {
  flex: 0 0 140px;
  width: 140px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 12px 16px;
  background: var(--surface2);
  border-left: 1px solid var(--border-subtle);
  align-items: stretch;
}

.ctrl-btn {
  padding: 5px 12px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
  white-space: nowrap;
  text-align: center;
}

.ctrl-btn:hover { background: var(--surface3); color: var(--text); }
.ctrl-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  pointer-events: none;
}

.ctrl-btn.act-start { color: var(--green); border-color: rgba(52,211,153,0.3); }
.ctrl-btn.act-stop { color: var(--red); border-color: rgba(248,113,113,0.3); }

.ctrl-btn.act-fault { color: var(--text-muted); border-color: var(--border); }
.ctrl-btn.act-fault.on {
  color: var(--fault);
  border-color: rgba(92,213,255,0.45);
  background: var(--fault-dim);
}


/* ── Legend (inline in main header area) ── */
.main-header {
  position: sticky;
  top: 0;
  z-index: 4;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.legend {
  display: flex;
  gap: 14px;
  margin-left: auto;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}

.legend-swatch {
  width: 12px;
  height: 12px;
  border-radius: 2px;
}

/* ── Empty state ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  gap: 8px;
}

.empty-state-icon {
  font-size: 32px;
  opacity: 0.3;
}

.empty-state-text {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.5px;
}

/* ── Resize handle ── */
.resize-handle {
  grid-column: 2;
  height: 4px;
  background: transparent;
  cursor: ns-resize;
  position: relative;
  z-index: 5;
}

.resize-handle:hover,
.resize-handle.active {
  background: var(--accent);
  opacity: 0.4;
}
</style>
</head>
<body>

<div class="app">
  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">Kaos</div>
      <div class="sidebar-subtitle">Kafka Consumer Group Simulator</div>
    </div>

    <div class="sidebar-scroll">
    <!-- Setup -->
    <div class="sidebar-section">
      <div class="section-label">Setup</div>
      <div class="field">
        <label class="field-label">Group ID</label>
        <input class="field-input" type="text" id="cfg-group-id" value="simulator-group">
      </div>
      <div class="field">
        <label class="field-label">Topic Prefix</label>
        <input class="field-input" type="text" id="cfg-topic-prefix" value="kaos">
      </div>
      <div class="field">
        <label class="field-label">Topics</label>
        <input class="field-input" type="number" id="cfg-num-topics" value="2" min="1" max="20">
      </div>
      <div class="field">
        <label class="field-label">Partitions</label>
        <input class="field-input" type="number" id="cfg-num-partitions" value="18" min="1" max="100">
      </div>
      <div class="field">
        <label class="field-label">Consumers</label>
        <input class="field-input" type="number" id="cfg-num-consumers" value="4" min="1" max="20">
      </div>
    </div>

    <!-- Group -->
    <div class="sidebar-section">
      <div class="section-label">Group</div>
      <div class="field">
        <label class="field-label">Session Timeout (ms)</label>
        <input class="field-input" type="number" id="cfg-session-timeout" value="45000" min="1000" max="300000">
      </div>
      <div class="field">
        <label class="field-label">Heartbeat Interval (ms)</label>
        <input class="field-input" type="number" id="cfg-heartbeat-interval" value="5000" min="500" max="60000">
      </div>
      <div class="field">
        <label class="field-label">Assignment Interval (ms)</label>
        <input class="field-input" type="number" id="cfg-assignment-interval" value="1000" min="0" max="60000">
      </div>
    </div>

    <!-- Consumer -->
    <div class="sidebar-section">
      <div class="section-label">Consumer</div>
      <div class="field">
        <label class="field-label">Protocol</label>
        <select class="field-input" id="cfg-protocol" onchange="onProtocolChange()">
          <option value="consumer">consumer</option>
          <option value="classic">classic</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Assignor</label>
        <select class="field-input" id="cfg-assignor"></select>
      </div>
      <div class="field">
        <label class="field-label">Poll Timeout (ms)</label>
        <input class="field-input" type="number" id="cfg-poll-timeout" value="0" min="0" max="60000">
      </div>
      <div class="field">
        <label class="field-label">Poll Delay (ms)</label>
        <input class="field-input" type="number" id="cfg-poll-delay" value="5000" min="0" max="120000">
      </div>
      <div class="field">
        <label class="field-label">Max Poll Interval (ms)</label>
        <input class="field-input" type="number" id="cfg-max-poll-interval" value="300000" min="1000" max="600000">
      </div>
      <div class="field">
        <label class="field-label">Static Members</label>
        <select class="field-input" id="cfg-static-members">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </div>
    </div>

    </div>

    <div class="sidebar-footer">
      <div class="sidebar-section">
        <button class="btn btn-start" id="btn-start" onclick="startSimulation()">Start</button>
        <button class="btn btn-autopilot" id="btn-autopilot" onclick="toggleAutopilot()" disabled style="margin-top:6px;">Auto-Pilot</button>
      </div>
    </div>
  </aside>

  <!-- ── Main: card grid ── -->
  <main class="main" id="main-area">
    <div class="empty-state" id="empty-state">
      <div class="empty-state-icon">&#9654;</div>
      <div class="empty-state-text">Configure and start a simulation</div>
    </div>
    <div id="view-wrapper" style="display:none;">
      <div class="main-header" id="main-header">
        <div class="header-status">
          <span id="status-type" class="status-badge s-type">&mdash;</span>
          <span id="status-state" class="status-badge s-idle">IDLE</span>
          <span class="status-item" id="status-item-epoch"><span class="status-label">epoch</span> <span id="status-epoch" class="status-value">&mdash;</span></span>
          <span class="status-item" id="status-item-target"><span class="status-label">target</span> <span id="status-target-epoch" class="status-value">&mdash;</span></span>
          <span class="status-item" id="status-item-generation" style="display:none;"><span class="status-label">generation</span> <span id="status-generation" class="status-value">&mdash;</span></span>
        </div>
        <div class="legend">
          <div class="legend-item">
            <div class="legend-swatch" style="background:var(--green-dim); border:1px solid rgba(52,211,153,0.25);"></div> Assigned
          </div>
          <div class="legend-item">
            <div class="legend-swatch" style="background:var(--accent-dim); border:1px solid rgba(76,154,255,0.3);"></div> Pending
          </div>
          <div class="legend-item">
            <div class="legend-swatch" style="background:var(--yellow-dim); border:1px solid rgba(251,191,36,0.35);"></div> Revoking
          </div>
        </div>
      </div>
      <div class="card-grid" id="card-grid"></div>
    </div>
  </main>
</div>

<script>
let pollInterval = null;
let autopilotRunning = false;
let currentConfig = null;
let prevState = null;
let prevCtrlState = {};
let simulationRunning = false;

const LOCKED_FIELDS = [
  'cfg-group-id', 'cfg-topic-prefix', 'cfg-num-topics', 'cfg-num-partitions',
  'cfg-num-consumers', 'cfg-session-timeout', 'cfg-heartbeat-interval',
  'cfg-assignment-interval', 'cfg-protocol', 'cfg-assignor',
  'cfg-poll-timeout', 'cfg-poll-delay', 'cfg-max-poll-interval', 'cfg-static-members'
];

function lockConfig() {
  LOCKED_FIELDS.forEach(id => document.getElementById(id).disabled = true);
}

function unlockConfig() {
  LOCKED_FIELDS.forEach(id => document.getElementById(id).disabled = false);
  // Re-apply protocol-dependent disabling for fields that don't apply
  // to the classic protocol.
  applyProtocolDisabling();
}

const ASSIGNORS_BY_PROTOCOL = {
  consumer: [
    {value: '', label: '(default)'},
    {value: 'uniform', label: 'uniform'},
    {value: 'range', label: 'range'}
  ],
  classic: [
    {value: 'range', label: 'range'},
    {value: 'roundrobin', label: 'roundrobin'},
    {value: 'sticky', label: 'sticky'},
    {value: 'cooperative-sticky', label: 'cooperative-sticky'}
  ]
};

// Group-level configs only apply to the consumer protocol.
const CONSUMER_ONLY_FIELDS = [
  'cfg-session-timeout', 'cfg-heartbeat-interval', 'cfg-assignment-interval'
];

function populateAssignors(protocol, preferredValue) {
  const sel = document.getElementById('cfg-assignor');
  const opts = ASSIGNORS_BY_PROTOCOL[protocol] || ASSIGNORS_BY_PROTOCOL.consumer;
  sel.innerHTML = '';
  for (const o of opts) {
    const opt = document.createElement('option');
    opt.value = o.value;
    opt.textContent = o.label;
    sel.appendChild(opt);
  }
  // Try to keep the previous selection if still valid; otherwise pick the first.
  if (preferredValue !== undefined && opts.some(o => o.value === preferredValue)) {
    sel.value = preferredValue;
  } else {
    sel.value = opts[0].value;
  }
}

function applyProtocolDisabling() {
  const protocol = document.getElementById('cfg-protocol').value;
  const isConsumer = protocol === 'consumer';
  for (const id of CONSUMER_ONLY_FIELDS) {
    document.getElementById(id).disabled = !isConsumer || simulationRunning;
  }
}

function onProtocolChange() {
  const protocol = document.getElementById('cfg-protocol').value;
  populateAssignors(protocol);
  applyProtocolDisabling();
}

function setSimulationUI(running) {
  simulationRunning = running;
  const btn = document.getElementById('btn-start');

  if (running) {
    lockConfig();
    btn.textContent = 'Stop';
    btn.className = 'btn btn-stop';
    btn.onclick = stopSimulation;
    btn.disabled = false;
    document.getElementById('btn-autopilot').disabled = false;
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('view-wrapper').style.display = '';
  } else {
    unlockConfig();
    btn.textContent = 'Start';
    btn.className = 'btn btn-start';
    btn.onclick = startSimulation;
    btn.disabled = false;
    document.getElementById('btn-autopilot').disabled = true;
    document.getElementById('btn-autopilot').className = 'btn btn-autopilot';
    document.getElementById('empty-state').style.display = '';
    document.getElementById('view-wrapper').style.display = 'none';
    document.getElementById('card-grid').innerHTML = '';
    updateStatus(null);
  }
}

function updateStatus(data) {
  const stateEl = document.getElementById('status-state');
  const typeEl = document.getElementById('status-type');
  const epochEl = document.getElementById('status-epoch');
  const targetEl = document.getElementById('status-target-epoch');
  const generationEl = document.getElementById('status-generation');
  const epochItem = document.getElementById('status-item-epoch');
  const targetItem = document.getElementById('status-item-target');
  const generationItem = document.getElementById('status-item-generation');

  if (!data || !data.groupState) {
    stateEl.textContent = simulationRunning ? 'STARTING' : 'IDLE';
    stateEl.className = 'status-badge s-idle';
    typeEl.textContent = '\u2014';
    epochEl.textContent = '\u2014';
    targetEl.textContent = '\u2014';
    generationEl.textContent = '\u2014';
    epochItem.style.display = '';
    targetItem.style.display = '';
    generationItem.style.display = 'none';
    return;
  }

  const rawGs = data.groupState || 'UNKNOWN';
  // Insert a space before each capital letter (except the first) so
  // PreparingRebalance / CompletingRebalance read with a space.
  const gs = rawGs.replace(/([a-z])([A-Z])/g, '$1 $2').toUpperCase();
  let badgeCls = 's-empty';
  if (rawGs === 'Stable') badgeCls = 's-stable';
  else if (rawGs === 'Reconciling' || rawGs === 'Assigning' ||
           rawGs === 'PreparingRebalance' || rawGs === 'CompletingRebalance') badgeCls = 's-reconciling';

  stateEl.textContent = gs;
  stateEl.className = 'status-badge ' + badgeCls;

  const gtype = data.groupType || '\u2014';
  typeEl.textContent = gtype.toUpperCase();

  // Classic groups don't have group epoch / target epoch but do have a
  // group generation. Swap which fields are visible.
  const isClassic = gtype.toLowerCase() === 'classic';
  if (isClassic) {
    epochItem.style.display = 'none';
    targetItem.style.display = 'none';
    generationItem.style.display = '';
    generationEl.textContent = (data.groupGeneration != null && data.groupGeneration >= 0)
      ? data.groupGeneration : '\u2014';
  } else {
    epochItem.style.display = '';
    targetItem.style.display = '';
    generationItem.style.display = 'none';
    epochEl.textContent = (data.groupEpoch != null && data.groupEpoch >= 0) ? data.groupEpoch : '\u2014';
    targetEl.textContent = (data.targetAssignmentEpoch != null && data.targetAssignmentEpoch >= 0) ? data.targetAssignmentEpoch : '\u2014';
  }
}

async function startSimulation() {
  const btn = document.getElementById('btn-start');
  btn.disabled = true;
  btn.textContent = 'Starting\u2026';

  const config = {
    groupId: document.getElementById('cfg-group-id').value,
    topicPrefix: document.getElementById('cfg-topic-prefix').value,
    numTopics: parseInt(document.getElementById('cfg-num-topics').value),
    numPartitions: parseInt(document.getElementById('cfg-num-partitions').value),
    numConsumers: parseInt(document.getElementById('cfg-num-consumers').value),
    sessionTimeoutMs: parseInt(document.getElementById('cfg-session-timeout').value),
    heartbeatIntervalMs: parseInt(document.getElementById('cfg-heartbeat-interval').value),
    assignmentIntervalMs: parseInt(document.getElementById('cfg-assignment-interval').value),
    protocol: document.getElementById('cfg-protocol').value,
    assignor: document.getElementById('cfg-assignor').value,
    pollTimeoutMs: parseInt(document.getElementById('cfg-poll-timeout').value),
    pollDelayMs: parseInt(document.getElementById('cfg-poll-delay').value),
    maxPollIntervalMs: parseInt(document.getElementById('cfg-max-poll-interval').value),
    staticMembers: document.getElementById('cfg-static-members').value === 'true'
  };

  try {
    const resp = await fetch('/api/simulator/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(config)
    });
    if (!resp.ok) {
      const err = await resp.json();
      alert('Failed to start: ' + (err.error || resp.statusText));
      btn.disabled = false;
      btn.textContent = 'Start';
      return;
    }
    currentConfig = config;
    prevState = null;
    prevCtrlState = {};
    setSimulationUI(true);
    startPolling();
  } catch (e) {
    alert('Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Start';
  }
}

async function stopSimulation() {
  const btn = document.getElementById('btn-start');
  btn.disabled = true;
  btn.textContent = 'Stopping\u2026';
  stopPolling();
  try {
    await fetch('/api/simulator/stop', {method: 'POST'});
  } catch (e) { /* ignore */ }
  autopilotRunning = false;
  prevState = null;
  document.getElementById('btn-autopilot').className = 'btn-autopilot';
  setSimulationUI(false);
}

async function toggleAutopilot() {
  const btn = document.getElementById('btn-autopilot');
  if (autopilotRunning) {
    await fetch('/api/simulator/chaos/stop', {method: 'POST'});
    autopilotRunning = false;
    btn.className = 'btn btn-autopilot';
  } else {
    await fetch('/api/simulator/chaos/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({intervalMinMs: 10000, intervalMaxMs: 30000})
    });
    autopilotRunning = true;
    btn.className = 'btn btn-autopilot active';
  }
}

function startPolling() {
  pollInterval = setInterval(pollGroup, 500);
  pollGroup();
}

function stopPolling() {
  if (pollInterval) {
    clearInterval(pollInterval);
    pollInterval = null;
  }
}

async function pollGroup() {
  try {
    const resp = await fetch('/api/simulator/group');
    const data = await resp.json();
    if (data.phase !== 'RUNNING') return;
    updateStatus(data);
    renderGroup(data);
    prevState = data;
  } catch (e) { /* ignore */ }
}

function splitPartitionKey(key) {
  const lastDash = key.lastIndexOf('-');
  return [key.substring(0, lastDash), key.substring(lastDash + 1)];
}

// ── Rendering: bento cards ──

function badgeClassFor(state) {
  if (state === 'Stable') return 'stable';
  if (state === 'Reconciling') return 'reconciling';
  if (state === 'Stopping') return 'stopping';
  if (state === 'Joining') return 'joining';
  return 'stopped';
}

function renderGroup(data) {
  if (!currentConfig) return;

  const topics = [];
  for (let i = 1; i <= currentConfig.numTopics; i++) {
    topics.push(currentConfig.topicPrefix + '-' + i);
  }
  const numPartitions = currentConfig.numPartitions;
  const isClassic = (data.groupType || '').toLowerCase() === 'classic';

  const grid = document.getElementById('card-grid');
  const members = (data.members || []).slice().sort((a, b) => a.slotIndex - b.slotIndex);

  const validIds = new Set();

  for (const m of members) {
    const cardId = 'card-' + m.slotIndex;
    validIds.add(cardId);
    let card = document.getElementById(cardId);

    if (!card) {
      card = document.createElement('div');
      card.id = cardId;
      card.className = 'card';
      card.innerHTML =
        '<div class="card-meta">' +
          '<div class="card-meta-row">' +
            '<span class="member-name"></span>' +
            '<span class="badge"></span>' +
          '</div>' +
          '<div class="meta-line meta-line-id">' +
            '<span class="meta-line-label">id</span>' +
            '<span class="meta-line-value"></span>' +
          '</div>' +
          '<div class="meta-line meta-line-instance">' +
            '<span class="meta-line-label">instance</span>' +
            '<span class="meta-line-value"></span>' +
          '</div>' +
          '<div class="meta-line meta-line-epoch">' +
            '<span class="meta-line-label">epoch</span>' +
            '<span class="meta-line-value"></span>' +
          '</div>' +
        '</div>' +
        '<div class="zones"></div>' +
        '<div class="member-controls"></div>';
      grid.appendChild(card);
    }

    const isStopped = m.state === 'Stopped';
    const bCls = badgeClassFor(m.state);
    // Card root classes (state only — divergence applied below).
    card.className = 'card ' + bCls + (isStopped ? ' stopped' : '');

    // ── Metadata column ──
    const nameEl = card.querySelector('.member-name');
    const badgeEl = card.querySelector('.badge');
    const idValEl = card.querySelector('.meta-line-id .meta-line-value');
    const instanceValEl = card.querySelector('.meta-line-instance .meta-line-value');
    const epochValEl = card.querySelector('.meta-line-epoch .meta-line-value');

    if (nameEl.textContent !== m.clientId) nameEl.textContent = m.clientId;

    // Classic groups have no per-member state or epoch — hide those fields.
    if (isClassic) {
      badgeEl.style.display = 'none';
      card.querySelector('.meta-line-epoch').style.display = 'none';
    } else {
      badgeEl.style.display = '';
      if (badgeEl.textContent !== m.state) {
        badgeEl.textContent = m.state;
        badgeEl.className = 'badge ' + bCls;
      }
      card.querySelector('.meta-line-epoch').style.display = '';
      const epochTxt = (m.memberEpoch >= 0 ? String(m.memberEpoch) : '\u2014');
      if (epochValEl.textContent !== epochTxt) {
        epochValEl.textContent = epochTxt;
        epochValEl.className = 'meta-line-value' + (m.memberEpoch >= 0 ? '' : ' dim');
      }
    }

    const idTxt = m.memberId || '\u2014';
    if (idValEl.textContent !== idTxt) {
      idValEl.textContent = idTxt;
      idValEl.className = 'meta-line-value' + (m.memberId ? '' : ' dim');
    }

    const instanceTxt = m.instanceId || '\u2014';
    if (instanceValEl.textContent !== instanceTxt) {
      instanceValEl.textContent = instanceTxt;
      instanceValEl.className = 'meta-line-value' + (m.instanceId ? '' : ' dim');
    }

    // ── Zones ──
    const coordCurrent = new Set(m.assignment || []);
    const coordTarget = new Set(m.targetAssignment || []);
    const consumerLocal = new Set(m.localAssignment || []);

    // Coordinator-view (server) chips by topic, merging current + target.
    const serverByTopic = {};
    const consumerByTopic = {};
    let serverCount = 0;
    let consumerCount = 0;

    for (const t of topics) {
      serverByTopic[t] = [];
      consumerByTopic[t] = [];
    }

    for (const t of topics) {
      for (let p = 0; p < numPartitions; p++) {
        const key = t + '-' + p;
        const inCurrent = coordCurrent.has(key);
        const inTarget = coordTarget.has(key);
        const inLocal = consumerLocal.has(key);
        if (inCurrent && inTarget) {
          serverByTopic[t].push({p: p, cls: 'assigned'});
          serverCount++;
        } else if (inTarget) {
          serverByTopic[t].push({p: p, cls: 'pending-assignment'});
          serverCount++;
        } else if (inCurrent) {
          serverByTopic[t].push({p: p, cls: 'pending-revocation'});
          serverCount++;
        }
        if (inLocal) {
          consumerByTopic[t].push({p: p, cls: 'assigned'});
          consumerCount++;
        }
      }
    }

    const zonesEl = card.querySelector('.zones');

    // Signature key spans the whole grid; rebuild as a unit when anything moves.
    const zonesKey = serverCount + '|' + consumerCount + '|' + topics.map(t =>
      t + ':' + serverByTopic[t].map(c => c.p + c.cls[0]).join(',') +
      ':' + consumerByTopic[t].map(c => c.p).join(',')
    ).join('|');

    if (zonesEl.dataset.key !== zonesKey) {
      zonesEl.dataset.key = zonesKey;
      zonesEl.innerHTML = buildZonesGrid(topics, serverByTopic, consumerByTopic, serverCount, consumerCount);
    }

    // ── Controls ──
    const ctrlDiv = card.querySelector('.member-controls');
    const ctrlKey = m.subscribed + '|' + m.blocked + '|' + m.partitioned;
    const dis = !m.subscribed ? ' disabled' : '';

    if (ctrlKey !== prevCtrlState[m.slotIndex]) {
      prevCtrlState[m.slotIndex] = ctrlKey;
      let html = '';
      if (m.subscribed) {
        html += '<button class="ctrl-btn act-stop" onclick="unsubscribe(' + m.slotIndex + ')">stop</button>';
      } else {
        html += '<button class="ctrl-btn act-start" onclick="subscribe(' + m.slotIndex + ')">start</button>';
      }
      html += '<button class="ctrl-btn act-fault' + (m.blocked ? ' on' : '') + '"' + dis +
        ' onclick="' + (m.blocked ? 'unblockMember(' : 'blockMember(') + m.slotIndex + ')">' +
        (m.blocked ? 'resume' : 'freeze') + '</button>';
      html += '<button class="ctrl-btn act-fault' + (m.partitioned ? ' on' : '') + '"' + dis +
        ' onclick="' + (m.partitioned ? 'healMember(' : 'partitionMember(') + m.slotIndex + ')">' +
        (m.partitioned ? 'restore' : 'partition') + '</button>';
      html += '</div>';
      ctrlDiv.innerHTML = html;
    }
  }

  // Remove stale cards (consumer count shrank).
  for (let i = grid.children.length - 1; i >= 0; i--) {
    const child = grid.children[i];
    if (!validIds.has(child.id)) {
      grid.removeChild(child);
      const m = child.id.match(/^card-(\d+)$/);
      if (m) {
        delete prevCtrlState[parseInt(m[1])];
        delete localDelays[parseInt(m[1])];
      }
    }
  }
}

function buildZonesGrid(topics, serverByTopic, consumerByTopic, serverCount, consumerCount) {
  // 4-column grid: topic name | coordinator chips | divider | consumer chips.
  // The divider is a single element spanning all rows for a continuous line.
  let html = '';

  // Header row.
  html += '<div class="zone-cell zone-header zone-cell-name"></div>';
  html += '<div class="zone-cell zone-header zone-cell-server">' +
    '<span class="zone-label">Coordinator view</span>' +
    '<span class="zone-count">' + serverCount + ' part' + (serverCount === 1 ? '' : 's') + '</span>' +
    '</div>';
  html += '<div class="zone-cell zone-header zone-cell-consumer">' +
    '<span class="zone-label">Consumer view</span>' +
    '<span class="zone-count">' + consumerCount + ' part' + (consumerCount === 1 ? '' : 's') + '</span>' +
    '</div>';

  // One row per topic — three cells each.
  for (const t of topics) {
    html += '<div class="zone-cell zone-row zone-cell-name">' +
      '<span class="zone-topic-name" title="' + escapeHtml(t) + '">' + escapeHtml(t) + '</span>' +
      '</div>';

    html += '<div class="zone-cell zone-row zone-cell-server"><div class="zone-chips">';
    for (const c of serverByTopic[t]) {
      html += '<span class="partition-chip ' + c.cls + '">' + c.p + '</span>';
    }
    html += '</div></div>';

    html += '<div class="zone-cell zone-row zone-cell-consumer"><div class="zone-chips">';
    for (const c of consumerByTopic[t]) {
      html += '<span class="partition-chip ' + c.cls + '">' + c.p + '</span>';
    }
    html += '</div></div>';
  }

  return html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function setsEqual(a, b) {
  if (a.size !== b.size) return false;
  for (const v of a) if (!b.has(v)) return false;
  return true;
}

// ── Member control handlers ──

async function subscribe(index) {
  await fetch('/api/simulator/members/' + index + '/subscribe', {method: 'POST'});
}

async function unsubscribe(index) {
  await fetch('/api/simulator/members/' + index + '/unsubscribe', {method: 'POST'});
}

async function partitionMember(index) {
  await fetch('/api/simulator/members/' + index + '/partition', {method: 'POST'});
}

async function healMember(index) {
  await fetch('/api/simulator/members/' + index + '/heal', {method: 'POST'});
}

async function blockMember(index) {
  await fetch('/api/simulator/members/' + index + '/block', {method: 'POST'});
}

async function unblockMember(index) {
  await fetch('/api/simulator/members/' + index + '/unblock', {method: 'POST'});
}

// ── Init: check if simulation is already running ──
(async function() {
  // Default the assignor dropdown for the consumer protocol.
  populateAssignors('consumer');
  applyProtocolDisabling();

  try {
    const resp = await fetch('/api/simulator/status');
    const data = await resp.json();
    if (data.phase === 'RUNNING') {
      currentConfig = data.config;
      if (currentConfig) {
        document.getElementById('cfg-group-id').value = currentConfig.groupId || '';
        document.getElementById('cfg-topic-prefix').value = currentConfig.topicPrefix || '';
        document.getElementById('cfg-num-topics').value = currentConfig.numTopics || '';
        document.getElementById('cfg-num-partitions').value = currentConfig.numPartitions || '';
        document.getElementById('cfg-num-consumers').value = currentConfig.numConsumers || '';
        document.getElementById('cfg-session-timeout').value = currentConfig.sessionTimeoutMs || 45000;
        document.getElementById('cfg-heartbeat-interval').value = currentConfig.heartbeatIntervalMs || 5000;
        document.getElementById('cfg-assignment-interval').value = currentConfig.assignmentIntervalMs || 1000;
        const protocol = currentConfig.protocol || 'consumer';
        document.getElementById('cfg-protocol').value = protocol;
        populateAssignors(protocol, currentConfig.assignor || '');
        document.getElementById('cfg-poll-timeout').value = currentConfig.pollTimeoutMs || 0;
        document.getElementById('cfg-poll-delay').value = currentConfig.pollDelayMs || 10000;
        document.getElementById('cfg-max-poll-interval').value = currentConfig.maxPollIntervalMs || 300000;
        document.getElementById('cfg-static-members').value = currentConfig.staticMembers ? 'true' : 'false';
      }
      setSimulationUI(true);
      if (data.chaosRunning) {
        autopilotRunning = true;
        document.getElementById('btn-autopilot').className = 'btn btn-autopilot active';
      }
      startPolling();
    }
  } catch (e) { /* ignore */ }
})();
