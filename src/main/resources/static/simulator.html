  if (state === 'Stopping') return 'stopping';
  if (state === 'Joining') return 'joining';
  return 'stopped';
}

function renderGroup(data) {
  if (!currentConfig) return;

  var topics = [];
  for (var i = 1; i <= currentConfig.numTopics; i++) {
    topics.push(currentConfig.topicPrefix + '-' + i);
  }
  var numPartitions = currentConfig.numPartitions;
  var isClassic = (data.groupType || '').toLowerCase() === 'classic';
  var partitionLag = data.partitionLag || {};

  var grid = document.getElementById('card-grid');
  var members = (data.members || []).slice().sort(function(a, b) { return a.slotIndex - b.slotIndex; });

  var validIds = new Set();

  for (var mi = 0; mi < members.length; mi++) {
    var m = members[mi];
    var cardId = 'card-' + m.slotIndex;
    validIds.add(cardId);
    var card = document.getElementById(cardId);

    if (!card) {
      card = document.createElement('div');
      card.id = cardId;
      card.className = 'card';
      card.innerHTML =
        '<div class="card-meta">' +
          '<div class="card-meta-row">' +
            '<span class="member-name"></span>' +
            '<span class="badge"></span>' +
          '</div>' +
          '<div class="meta-line meta-line-protocol">' +
            '<span class="meta-line-label">protocol</span>' +
            '<span class="meta-line-value"></span>' +
          '</div>' +
          '<div class="meta-line meta-line-id">' +
            '<span class="meta-line-label">id</span>' +
            '<span class="meta-line-value"></span>' +
          '</div>' +
          '<div class="meta-line meta-line-instance">' +
            '<span class="meta-line-label">instance</span>' +
            '<span class="meta-line-value"></span>' +
          '</div>' +
          '<div class="meta-line meta-line-epoch">' +
            '<span class="meta-line-label">epoch</span>' +
            '<span class="meta-line-value"></span>' +
          '</div>' +
        '</div>' +
        '<div class="zones"></div>' +
        '<div class="member-controls"></div>';
      grid.appendChild(card);
    }

    var isStopped = m.state === 'Stopped';
    var bCls = badgeClassFor(m.state);
    var memberIsClassic = m.protocol === 'classic';

    card.className = 'card ' + bCls + (isStopped ? ' stopped' : '');

    var nameEl = card.querySelector('.member-name');
    var badgeEl = card.querySelector('.badge');
    var protocolValEl = card.querySelector('.meta-line-protocol .meta-line-value');
    var idValEl = card.querySelector('.meta-line-id .meta-line-value');
    var instanceValEl = card.querySelector('.meta-line-instance .meta-line-value');
    var epochValEl = card.querySelector('.meta-line-epoch .meta-line-value');

    if (nameEl.textContent !== m.clientId) nameEl.textContent = m.clientId;

    var protoTxt = m.protocol || '\u2014';
    if (protocolValEl.textContent !== protoTxt) protocolValEl.textContent = protoTxt;

    if (memberIsClassic) {
      badgeEl.style.display = 'none';
      card.querySelector('.meta-line-epoch').style.display = 'none';
    } else {
      badgeEl.style.display = '';
      if (badgeEl.textContent !== m.state) {
        badgeEl.textContent = m.state;
        badgeEl.className = 'badge ' + bCls;
      }
      card.querySelector('.meta-line-epoch').style.display = '';
      var epochTxt = (m.memberEpoch >= 0 ? String(m.memberEpoch) : '\u2014');
      if (epochValEl.textContent !== epochTxt) {
        epochValEl.textContent = epochTxt;
        epochValEl.className = 'meta-line-value' + (m.memberEpoch >= 0 ? '' : ' dim');
      }
    }

    var idTxt = m.memberId || '\u2014';
    if (idValEl.textContent !== idTxt) {
      idValEl.textContent = idTxt;
      idValEl.className = 'meta-line-value' + (m.memberId ? '' : ' dim');
    }

    var instanceTxt = m.instanceId || '\u2014';
    if (instanceValEl.textContent !== instanceTxt) {
      instanceValEl.textContent = instanceTxt;
      instanceValEl.className = 'meta-line-value' + (m.instanceId ? '' : ' dim');
    }

    // Zones
    var coordCurrent = new Set(m.assignment || []);
    var coordTarget = new Set(m.targetAssignment || []);
    var consumerLocal = new Set(m.localAssignment || []);

    var serverByTopic = {};
    var consumerByTopic = {};
    var serverCount = 0;
    var consumerCount = 0;

    for (var ti = 0; ti < topics.length; ti++) {
      serverByTopic[topics[ti]] = [];
      consumerByTopic[topics[ti]] = [];
    }

    for (var ti2 = 0; ti2 < topics.length; ti2++) {
      var t = topics[ti2];
      for (var p = 0; p < numPartitions; p++) {
        var key = t + '-' + p;
        var inCurrent = coordCurrent.has(key);
        var inTarget = coordTarget.has(key);
        var inLocal = consumerLocal.has(key);
        var lag = partitionLag[key];
        if (inCurrent && inTarget) {
          serverByTopic[t].push({p: p, cls: 'assigned', lag: lag});
          serverCount++;
        } else if (inTarget) {
          serverByTopic[t].push({p: p, cls: 'pending-assignment', lag: lag});
          serverCount++;
        } else if (inCurrent) {
          serverByTopic[t].push({p: p, cls: 'pending-revocation', lag: lag});
          serverCount++;
        }
        if (inLocal) {
          consumerByTopic[t].push({p: p, cls: 'assigned'});
          consumerCount++;
        }
      }
    }

    var zonesEl = card.querySelector('.zones');

    var zonesKey = serverCount + '|' + consumerCount + '|' + topics.map(function(t) {
      return t + ':' + serverByTopic[t].map(function(c) { return c.p + c.cls[0] + (c.lag != null ? 'L' + c.lag : ''); }).join(',') +
        ':' + consumerByTopic[t].map(function(c) { return c.p; }).join(',');
    }).join('|');

    if (zonesEl.dataset.key !== zonesKey) {
      zonesEl.dataset.key = zonesKey;
      zonesEl.innerHTML = buildZonesGrid(topics, serverByTopic, consumerByTopic, serverCount, consumerCount);
    }

    // Controls
    var ctrlDiv = card.querySelector('.member-controls');
    var ctrlKey = m.subscribed + '|' + m.blocked + '|' + m.partitioned + '|' + m.protocol;
    var dis = !m.subscribed ? ' disabled' : '';

    if (ctrlKey !== prevCtrlState[m.slotIndex]) {
      prevCtrlState[m.slotIndex] = ctrlKey;
      var ctrlHtml = '';
      if (m.subscribed) {
        ctrlHtml += '<button class="ctrl-btn act-stop" onclick="stopConsumer(' + m.slotIndex + ')">stop</button>';
      } else {
        ctrlHtml += '<button class="ctrl-btn act-start" onclick="startConsumer(' + m.slotIndex + ')">start</button>';
      }
      if (m.protocol === 'classic') {
        ctrlHtml += '<button class="ctrl-btn act-start"' + dis + ' onclick="upgradeConsumer(' + m.slotIndex + ')">upgrade</button>';
      } else {
        ctrlHtml += '<button class="ctrl-btn act-stop"' + dis + ' onclick="downgradeConsumer(' + m.slotIndex + ')">downgrade</button>';
      }
      ctrlHtml += '<button class="ctrl-btn act-fault' + (m.blocked ? ' on' : '') + '"' + dis +
        ' onclick="' + (m.blocked ? 'unblockMember(' : 'blockMember(') + m.slotIndex + ')">' +
        (m.blocked ? 'resume' : 'freeze') + '</button>';
      ctrlHtml += '<button class="ctrl-btn act-fault' + (m.partitioned ? ' on' : '') + '"' + dis +
        ' onclick="' + (m.partitioned ? 'healMember(' : 'partitionMember(') + m.slotIndex + ')">' +
        (m.partitioned ? 'restore' : 'partition') + '</button>';
      ctrlDiv.innerHTML = ctrlHtml;
    }
  }

  // Remove stale cards.
  for (var ci = grid.children.length - 1; ci >= 0; ci--) {
    var child = grid.children[ci];
    if (!validIds.has(child.id)) {
      grid.removeChild(child);
      var match = child.id.match(/^card-(\d+)$/);
      if (match) {
        delete prevCtrlState[parseInt(match[1])];
      }
    }
  }
}

function lagIntensity(lag) {
  if (lag == null || lag < 10) return 0;
  return Math.min(1.0, (lag - 10) / 90);
}

function lagStyle(cls, lag) {
  var t = lagIntensity(lag);
  if (t === 0 && lag != null) return '';
  if (lag == null) return '';

  var bgAlphaMin = 0.12, bgAlphaMax = 0.55;
  var borderAlphaMin = 0.25, borderAlphaMax = 0.7;
  var bgAlpha = (bgAlphaMin + t * (bgAlphaMax - bgAlphaMin)).toFixed(3);
  var borderAlpha = (borderAlphaMin + t * (borderAlphaMax - borderAlphaMin)).toFixed(3);

  if (cls === 'assigned') {
    return 'background:rgba(52,211,153,' + bgAlpha + ');border-color:rgba(52,211,153,' + borderAlpha + ');';
  } else if (cls === 'pending-assignment') {
    return 'background:rgba(76,154,255,' + bgAlpha + ');border-color:rgba(76,154,255,' + borderAlpha + ');';
  } else if (cls === 'pending-revocation') {
    return 'background:rgba(251,191,36,' + bgAlpha + ');border-color:rgba(251,191,36,' + borderAlpha + ');';
  }
  return '';
}

function buildZonesGrid(topics, serverByTopic, consumerByTopic, serverCount, consumerCount) {
  var html = '';

  html += '<div class="zone-cell zone-header zone-cell-name"></div>';
  html += '<div class="zone-cell zone-header zone-cell-server">' +
    '<span class="zone-label">Coordinator view</span>' +
    '<span class="zone-count">' + serverCount + ' part' + (serverCount === 1 ? '' : 's') + '</span>' +
    '</div>';
  html += '<div class="zone-cell zone-header zone-cell-consumer">' +
    '<span class="zone-label">Consumer view</span>' +
    '<span class="zone-count">' + consumerCount + ' part' + (consumerCount === 1 ? '' : 's') + '</span>' +
    '</div>';

  for (var ti = 0; ti < topics.length; ti++) {
    var t = topics[ti];
    html += '<div class="zone-cell zone-row zone-cell-name">' +
      '<span class="zone-topic-name" title="' + escapeHtml(t) + '">' + escapeHtml(t) + '</span>' +
      '</div>';

    html += '<div class="zone-cell zone-row zone-cell-server"><div class="zone-chips">';
    for (var si = 0; si < serverByTopic[t].length; si++) {
      var c = serverByTopic[t][si];
      var style = lagStyle(c.cls, c.lag);
      var title = c.lag != null ? ' data-lag="' + c.lag + '"' : '';
      html += '<span class="partition-chip ' + c.cls + '"' + title +
        (style ? ' style="' + style + '"' : '') + '>' + c.p + '</span>';
    }
    html += '</div></div>';

    html += '<div class="zone-cell zone-row zone-cell-consumer"><div class="zone-chips">';
    for (var ci2 = 0; ci2 < consumerByTopic[t].length; ci2++) {
      var c2 = consumerByTopic[t][ci2];
      html += '<span class="partition-chip ' + c2.cls + '">' + c2.p + '</span>';
    }
    html += '</div></div>';
  }

  return html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// -- Rendering: rows view (incremental — preserves hover state + open dropdowns) --

// Combine group state + chaos actions into a single effective badge.
// Priority: Stopped > Frozen > Partitioned > group state. Shared between
// the Bento view and the Rows view.
// Returns true if a consumer-protocol member has any partition that's still
// in flight — i.e. the coordinator's target doesn't match the consumer's local
// assignment. Used to override a reported `Stable` back to `Reconciling` while
// pending/revoking partitions exist.
function hasConsumerMismatch(m) {
  var target = m.targetAssignment || [];
  var current = m.assignment || [];
  var local = m.localAssignment || [];
  var targetSet = new Set(target);
  var localSet = new Set(local);
  // Pending: target has it, local doesn't.
  for (var i = 0; i < target.length; i++) {
    if (!localSet.has(target[i])) return true;
  }
  // Revoking: local (or coord's current) has something target doesn't.
  for (var j = 0; j < local.length; j++) {
    if (!targetSet.has(local[j])) return true;
  }
  for (var k = 0; k < current.length; k++) {
    if (!targetSet.has(current[k])) return true;
  }
  return false;
}

function computeStateBadge(m) {
  if (!m.subscribed || m.state === 'Stopped') return { show: true, text: 'STOPPED',     cls: 'stopped' };
  if (m.blocked)                              return { show: true, text: 'FROZEN',      cls: 'frozen' };
  if (m.partitioned)                          return { show: true, text: 'PARTITIONED', cls: 'partitioned' };

  var effectiveState = m.state;
  // For consumer protocol, a member with pending/revoking partitions is not
  // actually stable — the coord's memberEpoch may have caught up, but local
  // reconciliation hasn't settled. Surface this as Reconciling in the UI.
  if (m.protocol === 'consumer' && m.state === 'Stable' && hasConsumerMismatch(m)) {
    effectiveState = 'Reconciling';
  }

  var cls = badgeClassFor(effectiveState);
  if (m.protocol === 'classic')               return { show: false, text: '', cls: cls };
  return { show: true, text: effectiveState || '—', cls: cls };
}

// Shared action-menu builder — same markup for Bento and Rows views.
function buildActionMenuItems(m) {
  var dis = m.subscribed ? '' : ' disabled';
  var items = '';

  items += '<div class="chaos-group-label">Membership</div>';
  if (m.subscribed) {
    items += '<button class="chaos-item destructive" onclick="closeAllDd(); stopConsumer(' + m.slotIndex + ')">Stop consumer</button>';
  } else {
    items += '<button class="chaos-item" onclick="closeAllDd(); startConsumer(' + m.slotIndex + ')">Start consumer</button>';
  }
  if (m.protocol === 'classic') {
    items += '<button class="chaos-item"' + dis + ' onclick="closeAllDd(); upgradeConsumer(' + m.slotIndex + ')">Upgrade to consumer</button>';
  } else {
    items += '<button class="chaos-item"' + dis + ' onclick="closeAllDd(); downgradeConsumer(' + m.slotIndex + ')">Downgrade to classic</button>';
  }

  items += '<div class="chaos-group-label">Fault Injection</div>';
  if (m.partitioned) {
    items += '<button class="chaos-item" onclick="closeAllDd(); healMember(' + m.slotIndex + ')">Heal network</button>';
  } else {
    items += '<button class="chaos-item destructive"' + dis + ' onclick="closeAllDd(); partitionMember(' + m.slotIndex + ')">Partition network</button>';
  }
  if (m.blocked) {
    items += '<button class="chaos-item" onclick="closeAllDd(); unblockMember(' + m.slotIndex + ')">Unfreeze consumer</button>';
  } else {
    items += '<button class="chaos-item destructive"' + dis + ' onclick="closeAllDd(); blockMember(' + m.slotIndex + ')">Freeze consumer</button>';
  }

  return items;
}

// ------------------------------------------------------------------------
// Rows view (R8-01). Full-bleed heatmap strip with floating overlays
// (name + state badge on the left, Actions on the right), partition-id axis
// rail underneath, single fixed-positioned tooltip delegated on the grid,
// gauge-with-container cells, tunable strip height (S/M/L), LAG_MAX_SCALE
// = 100, pending cells show lag.
// ------------------------------------------------------------------------

// One shared <div> appended to <body>, positioned with position: fixed —
// escapes every stacking context (including the sticky .main-header).
var pcellTipEl = null;
var pcellTipCurrent = null;   // the .pcell currently hovered, or null

function ensurePcellTip() {
  if (pcellTipEl) return pcellTipEl;
  pcellTipEl = document.createElement('div');
  pcellTipEl.id = 'pcell-tip';
  pcellTipEl.setAttribute('role', 'tooltip');
  document.body.appendChild(pcellTipEl);
  return pcellTipEl;
}

function hidePcellTip() {
  if (!pcellTipEl) return;
  pcellTipEl.classList.remove('show');
  pcellTipCurrent = null;
}

function positionPcellTip(cell) {
  var tip = ensurePcellTip();
  var text = cell.getAttribute('data-tip');
  if (!text) { hidePcellTip(); return; }
  if (cell.classList && cell.classList.contains('empty')) { hidePcellTip(); return; }

  // Set text before measuring so the tooltip has its final size.
  if (tip.textContent !== text) tip.textContent = text;

  // Make it measurable without flicker: show off-screen, measure, then reposition.
  tip.classList.add('show');
  tip.style.left = '-9999px';
  tip.style.top  = '-9999px';

  var cellRect = cell.getBoundingClientRect();
  var tipRect  = tip.getBoundingClientRect();
  var tipW = tipRect.width  || 160;
  var tipH = tipRect.height || 24;

  var header = document.getElementById('main-header');
  var headerBottom = 0;
  if (header && header.offsetParent !== null) {
    headerBottom = header.getBoundingClientRect().bottom;
  }

  // Default: above the cell (8px gap). Flip to below if the tooltip would
  // collide with the sticky main header or go off the top of the viewport.
  var placeBelow = false;
  var aboveTop = cellRect.top - tipH - 8;
  if (aboveTop < headerBottom + 4 || aboveTop < 4) placeBelow = true;

  var top = placeBelow ? cellRect.bottom + 8 : cellRect.top - tipH - 8;

  // Horizontally center on the cell; clamp to viewport so the tooltip
  // doesn't spill off the left/right edges.
  var centerX = cellRect.left + cellRect.width / 2;
  var minLeft = 4 + tipW / 2;
  var maxLeft = (window.innerWidth || document.documentElement.clientWidth) - 4 - tipW / 2;
  if (centerX < minLeft) centerX = minLeft;
  if (centerX > maxLeft) centerX = maxLeft;

  tip.style.left = centerX + 'px';
  tip.style.top  = top + 'px';
}

// Refresh the tooltip TEXT without repositioning, after a poll has
// potentially updated the cell's data-tip. Called at the end of
// updateStripCellsNew(). Guards:
//  - the hovered cell must still be in the DOM (not pruned) and still
//    carry a data-tip (i.e. state is still non-empty). Otherwise we hide.
//  - we only touch textContent; left/top stay put so the tooltip does not
//    jitter under the cursor.
function refreshHoveredPcellTip() {
  if (!pcellTipCurrent || !pcellTipEl) return;
  var cell = pcellTipCurrent;
  if (!document.body.contains(cell)) { hidePcellTip(); return; }
  if (!cell.hasAttribute('data-tip')) { hidePcellTip(); return; }
  if (cell.classList.contains('empty')) { hidePcellTip(); return; }
  var text = cell.getAttribute('data-tip');
  if (pcellTipEl.textContent !== text) pcellTipEl.textContent = text;
}

// Event delegation on #rows-grid. mouseover/mouseout bubble, so moving
// across cells updates the tooltip cleanly.
function setupPcellTipDelegation() {
  var grid = document.getElementById('rows-grid');
  if (!grid || grid.dataset.tipBound === '1') return;
  grid.dataset.tipBound = '1';

  grid.addEventListener('mouseover', function(e) {
    if (uiSettings.mode !== 'new') return;
    var cell = e.target.closest ? e.target.closest('.pcell') : null;
    if (!cell || !grid.contains(cell)) return;
    if (!cell.hasAttribute('data-tip')) return;
    if (cell.classList.contains('empty')) return;
    pcellTipCurrent = cell;
    positionPcellTip(cell);
  });

  grid.addEventListener('mouseout', function(e) {
    var cell = e.target.closest ? e.target.closest('.pcell') : null;
    if (!cell) return;
    var to = e.relatedTarget;
    if (to && cell.contains(to)) return;
    if (pcellTipCurrent === cell) hidePcellTip();
  });

  // Hide on scroll / resize / click so the tooltip doesn't dangle in the
  // wrong place while content moves under it.
  window.addEventListener('scroll', hidePcellTip, true);
  window.addEventListener('resize', hidePcellTip);
  window.addEventListener('click', hidePcellTip, true);
}

// Lag is normalized against a fixed scale of 100 (R8-01 tuning). Partition
// lag >= 100 saturates the gauge; anything below 100 scales linearly.
const LAG_MAX_SCALE = 100;
const LAG_MIN_FILL_PCT = 8;

function lagFillPct(lag) {
  var pct = 0;
  if (lag != null && lag > 0) pct = Math.round((lag / LAG_MAX_SCALE) * 100);
  return Math.max(LAG_MIN_FILL_PCT, Math.min(100, pct));
}

function renderRowsNew(data) {
  if (!currentConfig) return;

  // Stash the current admin-reported group state so updateStripCellsNew can
  // factor it into classic / eager-assignor rebalance handling.
  currentGroupAdminState = data.groupState || null;

  var topics = [];
  for (var i = 1; i <= currentConfig.numTopics; i++) {
    topics.push(currentConfig.topicPrefix + '-' + i);
  }
  var numPartitions = currentConfig.numPartitions;
  var partitionLag = data.partitionLag || {};

  var grid = document.getElementById('rows-grid');
  if (!grid) return;

  // Ensure the floating-tooltip delegation is wired (idempotent).
  setupPcellTipDelegation();

  var members = (data.members || []).slice().sort(function(a, b) { return a.slotIndex - b.slotIndex; });
  var validIds = {};

  for (var mi = 0; mi < members.length; mi++) {
    var m = members[mi];
    var panelId = 'row-panel-' + m.slotIndex;
    validIds[panelId] = 1;
    var panel = document.getElementById(panelId);
    if (!panel) {
      panel = buildPanelSkeletonNew(m, topics, numPartitions);
      grid.appendChild(panel);
    }
    updatePanelNew(panel, m, topics, numPartitions, partitionLag);
  }

  // Remove stale panels (stopped members beyond numConsumers).
  for (var ci = grid.children.length - 1; ci >= 0; ci--) {
    var child = grid.children[ci];
    if (!validIds[child.id]) grid.removeChild(child);
  }
}

function buildPanelSkeletonNew(m, topics, numPartitions) {
  var panel = document.createElement('div');
  panel.id = 'row-panel-' + m.slotIndex;
  panel.className = 'row-panel';

  // Full-bleed strip: one topic-slice per topic, each with N cells
  // horizontally. Topic label does NOT live in the strip — it sits in
  // the axis rail below, inline with the partition-id ticks.
  var stripHtml = '';
  for (var ti = 0; ti < topics.length; ti++) {
    stripHtml += '<div class="row-strip-topic">';
    stripHtml += '<div class="row-strip-cells">';
    for (var p = 0; p < numPartitions; p++) {
      stripHtml += '<div class="pcell"></div>';
    }
    stripHtml += '</div>';
    stripHtml += '</div>';
  }

  // Axis rail: one band per topic. Each band holds a dim mono topic label
  // pinned to the left, followed by periodic partition-id ticks. Ticks
  // are computed in layoutAxisNew() once per skeleton build.
  var axisHtml = '';
  for (var ai = 0; ai < topics.length; ai++) {
    axisHtml += '<div class="row-axis-topic">' +
      '<span class="row-axis-topic-label" title="' + escapeHtml(topics[ai]) + '">' +
        escapeHtml(topics[ai]) +
      '</span>' +
    '</div>';
  }

  // The top-left overlay shows the state as a full-text BADGE plus the
  // member name and (on hover) meta chips. The top-right overlay shows
  // a visible "Actions ▾" text button.
  var actionsId = 'actions-' + m.slotIndex;
  panel.innerHTML =
    '<div class="row-strip">' + stripHtml + '</div>' +
    '<div class="row-axis">' + axisHtml + '</div>' +
    '<div class="row-overlay-left">' +
      '<span class="row-state-badge"></span>' +
      '<span class="member-name"></span>' +
      '<div class="row-header-meta">' +
        '<span class="row-header-meta-item meta-protocol"><span class="row-header-meta-label">protocol</span><span class="row-header-meta-value"></span></span>' +
        '<span class="row-header-meta-sep">&middot;</span>' +
        '<span class="row-header-meta-item meta-id"><span class="row-header-meta-label">id</span><span class="row-header-meta-value"></span></span>' +
        '<span class="row-header-meta-sep">&middot;</span>' +
        '<span class="row-header-meta-item meta-instance"><span class="row-header-meta-label">instance</span><span class="row-header-meta-value"></span></span>' +
        '<span class="row-header-meta-sep">&middot;</span>' +
        '<span class="row-header-meta-item meta-epoch"><span class="row-header-meta-label">epoch</span><span class="row-header-meta-value"></span></span>' +
      '</div>' +
    '</div>' +
    '<div class="row-overlay-right">' +
      '<div class="dd row-actions-dd" id="' + actionsId + '">' +
        '<button type="button" class="dd-btn row-actions-btn" onclick="toggleDd(\'' + actionsId + '\')" title="Actions" aria-label="Actions">' +
          '<span class="dd-value">Actions</span>' +
          '<span class="dd-chevron">&#9662;</span>' +
        '</button>' +
        '<div class="dd-menu chaos-menu"></div>' +
      '</div>' +
    '</div>';

  // Layout the axis tick labels once per skeleton build (stable for a
  // given topic count / partition count — rebuilds on config change).
  layoutAxisNew(panel, topics.length, numPartitions);

  return panel;
}

// Axis stride: every Nth partition gets a tick label.
function pickAxisStrideNew(numPartitions) {
  if (numPartitions >= 100) return 20;
  if (numPartitions >= 40)  return 10;
  if (numPartitions >= 15)  return 5;
  return Math.max(1, Math.ceil(numPartitions / 4));
}

// Position the periodic partition-id tick labels inside each axis band.
function layoutAxisNew(panel, numTopics, numPartitions) {
  var axisBands = panel.querySelectorAll('.row-axis-topic');
  if (!axisBands.length) return;
  var stride = pickAxisStrideNew(numPartitions);
  for (var ti = 0; ti < numTopics; ti++) {
    var band = axisBands[ti];
    var oldTicks = band.querySelectorAll('.row-axis-tick');
    for (var ot = 0; ot < oldTicks.length; ot++) oldTicks[ot].remove();
    var ticksHtml = '';
    for (var p = 0; p < numPartitions; p += stride) {
      var centerPct = ((p + 0.5) / numPartitions) * 100;
      ticksHtml += '<span class="row-axis-tick" style="left:' + centerPct.toFixed(2) + '%">' + p + '</span>';
    }
    band.insertAdjacentHTML('beforeend', ticksHtml);
  }
}

function updatePanelNew(panel, m, topics, numPartitions, partitionLag) {
  var isClassic = m.protocol === 'classic';
  var effState = computeStateBadge(m);
  var isStopped = effState.cls === 'stopped';

  var panelCls = 'row-panel ' + effState.cls + (isStopped ? ' stopped' : '');
  if (panel.className !== panelCls) panel.className = panelCls;

  // Name.
  var nameEl = panel.querySelector('.member-name');
  var nameTxt = m.clientId || '';
  if (nameEl.textContent !== nameTxt) {
    nameEl.textContent = nameTxt;
    nameEl.title = nameTxt;
  }

  // State as a full-text BADGE (STABLE / RECONCILING / STOPPED / FROZEN /
  // PARTITIONED). Always visible in the top-left overlay. Hidden only for
  // classic members with no chaos applied.
  var stateEl = panel.querySelector('.row-state-badge');
  if (stateEl) {
    if (!effState.show) {
      if (stateEl.style.display !== 'none') stateEl.style.display = 'none';
    } else {
      if (stateEl.style.display === 'none') stateEl.style.display = '';
      var stateCls = 'row-state-badge ' + effState.cls;
      if (stateEl.className !== stateCls) stateEl.className = stateCls;
      var stateTxt = (effState.text || '').toUpperCase();
      if (stateEl.textContent !== stateTxt) stateEl.textContent = stateTxt;
    }
  }

  // Line-2 meta items.
  setHeaderMetaNew(panel, '.meta-protocol', m.protocol || '—', !!m.protocol);
  setHeaderMetaNew(panel, '.meta-id',       m.memberId   || '—', !!m.memberId, m.memberId);
  setHeaderMetaNew(panel, '.meta-instance', m.instanceId || '—', !!m.instanceId, m.instanceId);

  // Epoch (consumer) vs generation (classic).
  var epochItem = panel.querySelector('.meta-epoch');
  var epochLbl  = epochItem.querySelector('.row-header-meta-label');
  if (isClassic) {
    if (epochLbl.textContent !== 'generation') epochLbl.textContent = 'generation';
    var hasGen = m.groupGeneration != null && m.groupGeneration >= 0;
    setHeaderMetaValueNew(epochItem, hasGen ? String(m.groupGeneration) : '—', hasGen);
  } else {
    if (epochLbl.textContent !== 'epoch') epochLbl.textContent = 'epoch';
    var hasEp = m.memberEpoch != null && m.memberEpoch >= 0;
    setHeaderMetaValueNew(epochItem, hasEp ? String(m.memberEpoch) : '—', hasEp);
  }

  // Partition strip cells.
  updateStripCellsNew(panel, m, topics, numPartitions, partitionLag);

  // Actions dropdown menu — regenerate only when action state changes.
  var actionsMenu = panel.querySelector('.row-actions-dd .chaos-menu');
  var actionsKey = [m.subscribed ? '1' : '0', m.protocol || '-',
                    m.partitioned ? '1' : '0', m.blocked ? '1' : '0'].join('|');
  if (actionsMenu.dataset.key !== actionsKey) {
    actionsMenu.dataset.key = actionsKey;
    actionsMenu.innerHTML = buildActionMenuItems(m);
  }
}

function setHeaderMetaNew(panel, selector, text, strong, fullTitle) {
  var item = panel.querySelector(selector);
  if (!item) return;
  setHeaderMetaValueNew(item, text, strong, fullTitle);
}

function setHeaderMetaValueNew(itemEl, text, strong, fullTitle) {
  var el = itemEl.querySelector('.row-header-meta-value');
  if (!el) return;
  if (el.textContent !== text) el.textContent = text;
  var cls = 'row-header-meta-value' + (strong ? '' : ' dim');
  if (el.className !== cls) el.className = cls;
  // Show full value on hover when truncated.
  if (fullTitle && el.title !== fullTitle) el.title = fullTitle;
  else if (!fullTitle && el.title) el.removeAttribute('title');
}

// Eager classic assignors revoke everything on a rebalance, then re-assign.
// cooperative-sticky is the one cooperative variant.
var COOPERATIVE_CLASSIC_ASSIGNORS = new Set(['cooperative-sticky']);
function isEagerClassicAssignor(assignor) {
  return !COOPERATIVE_CLASSIC_ASSIGNORS.has(assignor);
}

// Set once per poll by renderRowsNew; consulted by updateStripCellsNew.
var currentGroupAdminState = null;

function updateStripCellsNew(panel, m, topics, numPartitions, partitionLag) {
  var coordCurrent = new Set(m.assignment || []);
  var coordTarget  = new Set(m.targetAssignment || []);
  var consumerLocal = new Set(m.localAssignment || []);
  // A member is "out of group" when:
  //   (a) the user has stopped it locally (`!subscribed` / state `Stopped`) — we
  //       flip this immediately, without waiting for admin to catch up, or
  //   (b) the coordinator has no partitions for it (fenced or already removed).
  // In either case, drop every cell to empty so we don't paint stale assignments
  // while the admin API is lagging behind a PreparingRebalance.
  var isStoppedLocally = !m.subscribed || m.state === 'Stopped';
  var isOutOfGroup = isStoppedLocally
    || (coordCurrent.size === 0 && coordTarget.size === 0);

  // Classic protocol has no real target-vs-current distinction (the admin API
  // doesn't expose a separate target; the backend mirrors current into target).
  // Pending/revoking are consumer-protocol concepts and trying to synthesize them
  // for classic produces misleading colour flickers. For classic, we just trust the
  // admin's current assignment: owned → assigned, otherwise empty. The member-state
  // badge (RECONCILING / …) already conveys "a rebalance is in progress".
  //
  // One subtlety: while the group is in PreparingRebalance/CompletingRebalance with
  // an eager assignor (range / roundrobin / sticky), every member has already run
  // onPartitionsRevoked(full) locally — nobody is consuming. The admin API still
  // returns the last stable assignment, so trusting it blindly would show green
  // cells that don't reflect reality. Detect that case and force everything empty.
  var isClassic = m.protocol === 'classic';
  var classicEagerMidRebalance = isClassic
    && currentConfig
    && isEagerClassicAssignor(currentConfig.assignor)
    && (currentGroupAdminState === 'PreparingRebalance'
        || currentGroupAdminState === 'CompletingRebalance');

  var topicBlocks = panel.querySelectorAll('.row-strip-topic');
  for (var ti = 0; ti < topics.length; ti++) {
    var topicBlock = topicBlocks[ti];
    if (!topicBlock) continue;
    var t = topics[ti];
    var cells = topicBlock.querySelectorAll('.pcell');

    for (var p = 0; p < numPartitions; p++) {
      var cell = cells[p];
      if (!cell) continue;
      var key = t + '-' + p;
      var inCurrent = !isOutOfGroup && coordCurrent.has(key);
      var inTarget  = !isOutOfGroup && coordTarget.has(key);
      var inLocal   = !isOutOfGroup && consumerLocal.has(key);
      var lag = partitionLag[key];

      var state = 'empty';
      var fillPct = 0;

      if (isClassic) {
        if (inCurrent && !classicEagerMidRebalance) {
          state = 'assigned';
          fillPct = lagFillPct(lag);
        }
      } else if (inTarget && inLocal) {
        state = 'assigned';
        fillPct = lagFillPct(lag);
      } else if (inTarget && !inLocal) {
        // Pending cells also show a lag gauge — the partition is queued
        // for this consumer, and any lag tracked is worth seeing.
        state = 'pending';
        fillPct = lagFillPct(lag);
      } else if (!inTarget && (inCurrent || inLocal)) {
        state = 'revoking';
        fillPct = lagFillPct(lag);
      }

      // Tooltips ONLY on non-empty cells (don't pollute unowned slots).
      var tip = '';
      if (state !== 'empty') {
        tip = t + ' / p' + p + ' · ' + state;
        if (lag != null && lag > 0) tip += ' · lag ' + lag;
      }

      var newCls = 'pcell ' + state;
      if (cell.className !== newCls) cell.className = newCls;

      var curFill = cell.style.getPropertyValue('--fill');
      var newFill = fillPct > 0 ? fillPct + '%' : '';
      if (curFill !== newFill) {
        if (newFill) cell.style.setProperty('--fill', newFill);
        else cell.style.removeProperty('--fill');
      }

      var curTip = cell.getAttribute('data-tip') || '';
      if (curTip !== tip) {
        if (tip) cell.setAttribute('data-tip', tip);
        else cell.removeAttribute('data-tip');
      }
    }
  }

  // After ALL cells have been refreshed, if the user is still hovering one
  // of our cells, swap the tooltip text to match the latest data-tip value
  // (e.g. updated lag). Position is left untouched so the tooltip stays
  // anchored under the cursor without jitter.
  refreshHoveredPcellTip();
}

// -- Member control handlers --

async function startConsumer(index) {
  await fetch('/api/simulator/members/' + index + '/subscribe', {method: 'POST'});
}

async function stopConsumer(index) {
  await fetch('/api/simulator/members/' + index + '/unsubscribe', {method: 'POST'});
}

async function upgradeConsumer(index) {
  await fetch('/api/simulator/members/' + index + '/upgrade', {method: 'POST'});
}

async function downgradeConsumer(index) {
  await fetch('/api/simulator/members/' + index + '/downgrade', {method: 'POST'});
}

async function partitionMember(index) {
  await fetch('/api/simulator/members/' + index + '/partition', {method: 'POST'});
}

async function healMember(index) {
  await fetch('/api/simulator/members/' + index + '/heal', {method: 'POST'});
}

async function blockMember(index) {
  await fetch('/api/simulator/members/' + index + '/block', {method: 'POST'});
}

async function unblockMember(index) {
  await fetch('/api/simulator/members/' + index + '/unblock', {method: 'POST'});
}

// -- Init: pre-seed 3 inheriting consumers, check if already running --
(async function() {
  // Pre-seed 3 consumers inheriting everything so the user can hit Start immediately.
  for (var i = 0; i < 3; i++) {
    consumerEntries.push({ id: nextConsumerId++, expanded: false, overrides: {} });
  }
  renderAll();
  // Apply persisted UI settings (mode + strip-height preset) on boot.
  applyAllUiSettings();
  // Prepare the shared floating tooltip element.
  ensurePcellTip();

  try {
    var resp = await fetch('/api/simulator/status');
    var data = await resp.json();
    if (data.phase === 'RUNNING') {
      currentConfig = data.config;
      if (currentConfig) {
        document.getElementById('cfg-group-id').value = currentConfig.groupId || '';
        document.getElementById('cfg-num-topics').value = currentConfig.numTopics || '';
        document.getElementById('cfg-num-partitions').value = currentConfig.numPartitions || '';

        // Restore group protocol, assignor, static.
        if (currentConfig.protocol) groupState.protocol = currentConfig.protocol;
        if (currentConfig.assignor) {
          var valid = ASSIGNOR_OPTIONS[groupState.protocol] || ASSIGNOR_OPTIONS.consumer;
          groupState.assignor = valid.indexOf(currentConfig.assignor) !== -1 ? currentConfig.assignor : valid[0];
        }
        groupState.staticMember = currentConfig.staticMembers ? 'true' : 'false';

        // Rehydrate group optional settings only when they differ from defaults.
        groupOptionalSettings = {};
        GROUP_OPTIONAL_FIELDS.forEach(function(f) {
          var v = currentConfig[f.key];
          if (v != null && v !== f.default) groupOptionalSettings[f.key] = v;
        });

        // Restore consumer count (no overrides — per-consumer diffs aren't persisted server-side).
        var numConsumers = currentConfig.numConsumers || 3;
        consumerEntries = [];
        nextConsumerId = 0;
        for (var j = 0; j < numConsumers; j++) {
          consumerEntries.push({ id: nextConsumerId++, expanded: false, overrides: {} });
        }
        renderAll();
      }
      setSimulationUI(true);
      if (data.chaosRunning) {
        autopilotRunning = true;
        document.getElementById('btn-autopilot-config').className = 'btn btn-autopilot active';
      }
      startPolling();
    }
  } catch (e) { /* ignore */ }
})();
</script>
