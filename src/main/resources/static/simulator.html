<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaos — Kafka Consumer Group Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e14;
  --surface: #12171f;
  --surface2: #1a2029;
  --surface3: #222a35;
  --border: #2a3342;
  --border-subtle: #1e2736;
  --text: #d4dce8;
  --text-muted: #6b7a8d;
  --text-dim: #4a5568;
  --accent: #4c9aff;
  --accent-dim: rgba(76,154,255,0.12);
  --green: #34d399;
  --green-dim: rgba(52,211,153,0.12);
  --yellow: #fbbf24;
  --yellow-dim: rgba(251,191,36,0.10);
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.10);
  --fault: #5cd5ff;
  --fault-dim: rgba(92,213,255,0.12);
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
  --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --sidebar-w: 340px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

/* -- Layout shell -- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: 1fr;
  height: 100vh;
  gap: 0;
}

/* -- Sidebar -- */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100vh;
}

.sidebar-header {
  flex: 0 0 auto;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
}

.sidebar-brand {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
}

.sidebar-subtitle {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
  letter-spacing: 0.3px;
}

/* -- Config mode container -- */
#config-mode {
  display: flex;
  flex-direction: column;
  flex: 1 1 0;
  min-height: 0;
  overflow: hidden;
}

/* -- Scrollable config area -- */
.config-scroll {
  flex: 1 1 0;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
}

.config-scroll::-webkit-scrollbar { width: 4px; }
.config-scroll::-webkit-scrollbar-track { background: transparent; }
.config-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* -- Collapsible sections -- */
.config-section {
  border-bottom: 1px solid var(--border);
}

.section-toggle {
  display: flex;
  align-items: center;
  width: 100%;
  padding: 10px 16px;
  background: transparent;
  border: none;
  cursor: pointer;
  gap: 8px;
  font-family: var(--font-mono);
  transition: background 0.1s;
  user-select: none;
}
.section-toggle:hover { background: var(--surface2); }

.section-chevron {
  font-size: 9px;
  color: var(--text-dim);
  transition: transform 0.2s ease;
  flex: 0 0 auto;
  width: 12px;
  text-align: center;
}
.config-section.expanded .section-chevron { transform: rotate(90deg); }

.section-title {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
}
.config-section.expanded .section-title { color: var(--text-muted); }

.section-tag {
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 600;
  letter-spacing: 0.3px;
  font-family: var(--font-mono);
  margin-left: 4px;
}

.tag-consumer {
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid rgba(76,154,255,0.2);
}

.tag-classic {
  background: var(--yellow-dim);
  color: var(--yellow);
  border: 1px solid rgba(251,191,36,0.2);
}

.section-summary {
  font-size: 10px;
  color: var(--text-dim);
  margin-left: auto;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: 0.2px;
  font-family: var(--font-mono);
}

.section-remove {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 3px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  font-family: var(--font-mono);
  cursor: pointer;
  line-height: 1;
  padding: 0;
  transition: background 0.1s, color 0.1s;
  opacity: 0;
}
.section-toggle:hover .section-remove { opacity: 1; }
.section-remove:hover { background: var(--red-dim); color: var(--red); }

.section-body {
  display: none;
  padding: 0 16px 14px;
}
.config-section.expanded .section-body { display: block; }

/* -- Running state: config stays visible but grayed out -- */
#config-mode.locked .config-scroll {
  opacity: 0.45;
}
#config-mode.locked .field-input,
#config-mode.locked .btn-add-consumer {
  pointer-events: none;
}
#config-mode.locked .btn-add-consumer { display: none; }
#config-mode.locked .section-remove { display: none; }

/* -- Form fields -- */
.field {
  margin-bottom: 8px;
}
.field:last-child { margin-bottom: 0; }

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.field-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 4px;
  letter-spacing: 0.3px;
}

.field-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-family: var(--font-mono);
  transition: border-color 0.15s;
}
.field-input:focus {
  outline: none;
  border-color: var(--accent);
}
.field-input:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  background: var(--surface2);
}

.field-hint {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 3px;
  margin-bottom: 8px;
  letter-spacing: 0.2px;
  font-style: italic;
}

/* -- Add consumer row -- */
.add-consumer-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}

.btn-add-consumer {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface3);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.btn-add-consumer:hover {
  background: var(--accent-dim);
  color: var(--accent);
  border-color: rgba(76,154,255,0.3);
}

/* -- Buttons -- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  border: none;
  cursor: pointer;
  transition: opacity 0.12s, background 0.12s;
  flex: 1;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn:active { transform: scale(0.98); }

.btn-start { background: var(--green); color: #0a0e14; }
.btn-stop { background: var(--red); color: #0a0e14; }

.btn-autopilot {
  width: 100%;
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--text-muted);
}
.btn-autopilot:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.btn-autopilot.active {
  background: var(--yellow-dim);
  border-color: rgba(251,191,36,0.3);
  color: var(--yellow);
}

/* -- Sidebar footer -- */
.sidebar-footer {
  flex: 0 0 auto;
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* -- Running mode sidebar -- */
.running-controls {
  display: none;
  padding: 0;
}

.running-controls.active {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.running-info {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
}

.running-info-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 4px;
}

.running-info-value {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text);
  font-weight: 600;
}

.running-footer {
  flex: 0 0 auto;
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* -- Status line (in main header) -- */
.header-status {
  display: flex;
  align-items: center;
  gap: 12px;
}

.status-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.status-label {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}

.status-value {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
}

.status-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.status-badge.s-stable { background: var(--green-dim); color: var(--green); }
.status-badge.s-reconciling, .status-badge.s-assigning { background: var(--yellow-dim); color: var(--yellow); }
.status-badge.s-empty { background: rgba(107,122,141,0.12); color: var(--text-dim); }
.status-badge.s-idle { background: rgba(107,122,141,0.12); color: var(--text-dim); }
.status-badge.s-type {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
}

/* -- Main area -- */
.main {
  overflow: auto;
  padding: 0;
  background: var(--bg);
}
.main::-webkit-scrollbar { width: 6px; height: 6px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* -- Bento card grid -- */
.card-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  padding: 14px;
  align-content: start;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  overflow: hidden;
  transition: border-color 0.25s, opacity 0.25s, box-shadow 0.3s;
  position: relative;
}

.card.stable { border-color: rgba(52,211,153,0.35); }
.card.reconciling {
  border-color: rgba(251,191,36,0.45);
  box-shadow: 0 0 0 1px rgba(251,191,36,0.12), 0 0 22px -8px rgba(251,191,36,0.4);
}
.card.stopping { border-color: rgba(248,113,113,0.4); }
.card.joining { border-color: rgba(76,154,255,0.45); }
.card.stopped { opacity: 0.45; }

.card::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--text-dim);
  transition: background 0.2s;
  z-index: 1;
}
.card.stable::before    { background: var(--green); }
.card.reconciling::before { background: var(--yellow); }
.card.stopping::before  { background: var(--red); }
.card.joining::before   { background: var(--accent); }
.card.stopped::before   { background: var(--text-dim); }

.card-meta {
  flex: 0 0 260px;
  padding: 14px 16px 14px 20px;
  background: var(--surface2);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.card-meta-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.member-name {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
  letter-spacing: 0.3px;
  flex-shrink: 0;
}

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  flex-shrink: 0;
}
.badge.stable { background: var(--green-dim); color: var(--green); }
.badge.reconciling { background: var(--yellow-dim); color: var(--yellow); }
.badge.stopping { background: var(--red-dim); color: var(--red); }
.badge.stopped { background: rgba(107,122,141,0.12); color: var(--text-dim); }
.badge.joining { background: var(--accent-dim); color: var(--accent); }

.meta-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  min-width: 0;
}

.meta-line-label {
  flex: 0 0 auto;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  opacity: 0.8;
  width: 56px;
}

.meta-line-value {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.meta-line-value.dim {
  color: var(--text-dim);
  opacity: 0.6;
  font-weight: 400;
}

.zones {
  display: grid;
  grid-template-columns: auto 1fr 1fr;
  align-items: stretch;
  flex: 1 1 auto;
  min-width: 0;
  background: var(--bg);
  padding: 12px 16px;
  column-gap: 14px;
  row-gap: 0;
  align-content: start;
}

.zone-cell {
  padding: 4px 0;
  display: flex;
  align-items: flex-start;
}
.zone-cell.zone-cell-name { grid-column: 1; padding-right: 24px; }
.zone-cell.zone-cell-server { grid-column: 2; }
.zone-cell.zone-cell-consumer { grid-column: 3; }

.zone-cell.zone-header {
  align-items: center;
  padding-top: 0;
  padding-bottom: 8px;
}

.zone-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.3px;
  color: var(--text-dim);
}

.zone-count {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  margin-left: auto;
  letter-spacing: 0.3px;
}

.zone-cell.zone-row { border-top: 1px solid var(--border-subtle); }

.zone-topic-name {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  line-height: 26px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.zone-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  flex: 1;
  min-height: 26px;
  align-items: flex-start;
  align-content: flex-start;
}

.zone-empty {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  font-style: italic;
}

.partition-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  padding: 0;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font-mono);
  flex: 0 0 auto;
  transition: background 0.25s, color 0.25s;
  box-sizing: border-box;
}

.partition-chip[data-lag] { position: relative; }
.partition-chip[data-lag]:hover::after {
  content: "lag: " attr(data-lag);
  position: absolute;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface3);
  color: var(--text);
  font-size: 10px;
  font-weight: 600;
  padding: 3px 6px;
  border-radius: 3px;
  white-space: nowrap;
  z-index: 10;
  pointer-events: none;
  border: 1px solid var(--border);
}

.partition-chip.assigned {
  background: var(--green-dim);
  color: var(--green);
  border: 1px solid rgba(52,211,153,0.25);
}
.partition-chip.pending-assignment {
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid rgba(76,154,255,0.3);
}
.partition-chip.pending-revocation {
  background: var(--yellow-dim);
  color: var(--yellow);
  border: 1px solid rgba(251,191,36,0.35);
}

/* -- Right column: per-consumer controls -- */
.member-controls {
  flex: 0 0 140px;
  width: 140px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 12px 16px;
  background: var(--surface2);
  border-left: 1px solid var(--border-subtle);
  align-items: stretch;
}

.ctrl-btn {
  padding: 5px 12px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
  white-space: nowrap;
  text-align: center;
}
.ctrl-btn:hover { background: var(--surface3); color: var(--text); }
.ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

.ctrl-btn.act-start { color: var(--green); border-color: rgba(52,211,153,0.3); }
.ctrl-btn.act-stop { color: var(--red); border-color: rgba(248,113,113,0.3); }

.ctrl-btn.act-fault { color: var(--text-muted); border-color: var(--border); }
.ctrl-btn.act-fault.on {
  color: var(--fault);
  border-color: rgba(92,213,255,0.45);
  background: var(--fault-dim);
}

/* -- Legend -- */
.main-header {
  position: sticky;
  top: 0;
  z-index: 4;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.legend {
  display: flex;
  gap: 14px;
  margin-left: auto;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}

.legend-swatch {
  width: 12px;
  height: 12px;
  border-radius: 2px;
}

/* -- Empty state -- */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  gap: 8px;
}

.empty-state-icon {
  font-size: 32px;
  opacity: 0.3;
}

.empty-state-text {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">Kaos</div>
      <div class="sidebar-subtitle">Kafka Consumer Group Simulator</div>
    </div>

    <!-- Config mode (shown when not running) -->
    <div id="config-mode">
      <div class="config-scroll" id="config-scroll">

        <!-- Section: Group (merged with former Cluster settings) -->
        <div class="config-section expanded" id="section-group">
          <button class="section-toggle" onclick="toggleSection('section-group')" type="button">
            <span class="section-chevron">&#9654;</span>
            <span class="section-title">Group</span>
          </button>
          <div class="section-body">
            <div class="field">
              <label class="field-label">Group ID</label>
              <input class="field-input" type="text" id="cfg-group-id" value="kaos">
            </div>
            <div class="field-row">
              <div class="field">
                <label class="field-label">Subscribed Topics</label>
                <input class="field-input" type="number" id="cfg-num-topics" value="1" min="1" max="20">
              </div>
              <div class="field">
                <label class="field-label">Partitions / Topic</label>
                <input class="field-input" type="number" id="cfg-num-partitions" value="36" min="1" max="100">
              </div>
            </div>
            <div class="field-hint">Each topic will be named {groupId}-1, {groupId}-2, etc.</div>
            <div class="field">
              <label class="field-label">Session Timeout (ms)</label>
              <input class="field-input" type="number" id="cfg-session-timeout" value="45000" min="1000" max="300000">
            </div>
            <div class="field">
              <label class="field-label">Heartbeat Interval (ms)</label>
              <input class="field-input" type="number" id="cfg-heartbeat-interval" value="5000" min="500" max="60000">
            </div>
            <div class="field">
              <label class="field-label">Assignment Interval (ms)</label>
              <input class="field-input" type="number" id="cfg-assignment-interval" value="1000" min="0" max="60000">
            </div>
            <div class="field">
              <label class="field-label">Poll Timeout (ms)</label>
              <input class="field-input" type="number" id="cfg-default-poll-timeout" value="0" min="0" max="60000">
            </div>
            <div class="field">
              <label class="field-label">Poll Delay (ms)</label>
              <input class="field-input" type="number" id="cfg-default-poll-delay" value="1000" min="0" max="120000">
            </div>
            <div class="field">
              <label class="field-label">Max Poll Interval (ms)</label>
              <input class="field-input" type="number" id="cfg-default-max-poll-interval" value="300000" min="1000" max="600000">
            </div>
            <div class="field">
              <label class="field-label">Static Members</label>
              <input class="field-input" type="text" id="cfg-default-static-member" value="false" list="static-member-suggestions">
              <datalist id="static-member-suggestions">
                <option value="false">
                <option value="true">
              </datalist>
            </div>
            <div class="field">
              <label class="field-label">Consumer Assignor</label>
              <select class="field-input" id="cfg-default-consumer-assignor">
                <option value="">(default)</option>
                <option value="uniform">uniform</option>
                <option value="range">range</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label">Classic Assignor</label>
              <select class="field-input" id="cfg-default-classic-assignor">
                <option value="">(default)</option>
                <option value="range">range</option>
                <option value="roundrobin">roundrobin</option>
                <option value="sticky">sticky</option>
                <option value="cooperative-sticky">cooperative-sticky</option>
              </select>
            </div>
            <div class="field-hint">These defaults pre-populate new consumers.</div>
          </div>
        </div>

        <!-- Consumer sections are rendered dynamically here -->
        <div id="consumer-sections"></div>

        <!-- Add Consumer row -->
        <div class="add-consumer-row">
          <button class="btn-add-consumer" onclick="addConsumer()" type="button">+ Add Consumer</button>
          <button class="btn-add-consumer" onclick="duplicateLastConsumer()" type="button">+ Duplicate Last</button>
        </div>

      </div>

      <!-- Footer with Start / Auto-Pilot -->
      <div class="sidebar-footer" id="config-footer">
        <button class="btn btn-start" id="btn-start-sim" onclick="toggleSimulation()">Start</button>
        <button class="btn btn-autopilot" id="btn-autopilot-config" onclick="toggleAutopilot()" disabled>Auto-Pilot</button>
      </div>
    </div>

  </aside>

  <!-- Main: card grid -->
  <main class="main" id="main-area">
    <div class="empty-state" id="empty-state">
      <div class="empty-state-icon">&#9654;</div>
      <div class="empty-state-text">Configure and start a simulation</div>
    </div>
    <div id="view-wrapper" style="display:none;">
      <div class="main-header" id="main-header">
        <div class="header-status">
          <span id="status-type" class="status-badge s-type">&mdash;</span>
          <span id="status-state" class="status-badge s-idle">IDLE</span>
          <span class="status-item" id="status-item-epoch"><span class="status-label">epoch</span> <span id="status-epoch" class="status-value">&mdash;</span></span>
          <span class="status-item" id="status-item-target"><span class="status-label">target</span> <span id="status-target-epoch" class="status-value">&mdash;</span></span>
          <span class="status-item" id="status-item-generation" style="display:none;"><span class="status-label">generation</span> <span id="status-generation" class="status-value">&mdash;</span></span>
        </div>
        <div class="legend">
          <div class="legend-item">
            <div class="legend-swatch" style="background:var(--green-dim); border:1px solid rgba(52,211,153,0.25);"></div> Assigned
          </div>
          <div class="legend-item">
            <div class="legend-swatch" style="background:var(--accent-dim); border:1px solid rgba(76,154,255,0.3);"></div> Pending
          </div>
          <div class="legend-item">
            <div class="legend-swatch" style="background:var(--yellow-dim); border:1px solid rgba(251,191,36,0.35);"></div> Revoking
          </div>
          <div class="legend-item" style="margin-left:8px; gap:3px;">
            <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:0.3px;">LAG</span>
            <div style="display:flex;align-items:center;gap:1px;">
              <div class="legend-swatch" style="width:8px;background:rgba(52,211,153,0.12); border:1px solid rgba(52,211,153,0.20);"></div>
              <div class="legend-swatch" style="width:8px;background:rgba(52,211,153,0.25); border:1px solid rgba(52,211,153,0.35);"></div>
              <div class="legend-swatch" style="width:8px;background:rgba(52,211,153,0.40); border:1px solid rgba(52,211,153,0.50);"></div>
              <div class="legend-swatch" style="width:8px;background:rgba(52,211,153,0.55); border:1px solid rgba(52,211,153,0.70);"></div>
            </div>
            <span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);">low..high</span>
          </div>
        </div>
      </div>
      <div class="card-grid" id="card-grid"></div>
    </div>
  </main>
</div>

<script>
let pollInterval = null;
let autopilotRunning = false;
let currentConfig = null;
let prevState = null;
let prevCtrlState = {};
let simulationRunning = false;

// -- Consumer entries state --
let consumerEntries = [];
let nextConsumerId = 0;

// Datalist suggestions per protocol (for the assignor text input).
const ASSIGNOR_SUGGESTIONS = {
  consumer: ['uniform', 'range'],
  classic: ['range', 'roundrobin', 'sticky', 'cooperative-sticky']
};

// -- Section collapse/expand --
function toggleSection(sectionId) {
  var el = document.getElementById(sectionId);
  if (el) el.classList.toggle('expanded');
}

// -- Read Group-level defaults --
function getDefaults() {
  return {
    pollTimeoutMs:     parseInt(document.getElementById('cfg-default-poll-timeout').value) || 0,
    pollDelayMs:       parseInt(document.getElementById('cfg-default-poll-delay').value) || 1000,
    maxPollIntervalMs: parseInt(document.getElementById('cfg-default-max-poll-interval').value) || 300000,
    staticMember:      document.getElementById('cfg-default-static-member').value || 'false',
    consumerAssignor:  document.getElementById('cfg-default-consumer-assignor').value || '',
    classicAssignor:   document.getElementById('cfg-default-classic-assignor').value || '',
  };
}

// -- Consumer CRUD --
function addConsumer() {
  var protocol = 'consumer';
  var defaults = getDefaults();
  var id = nextConsumerId++;
  var name = 'consumer-' + (consumerEntries.length);
  var assignor = (protocol === 'consumer') ? defaults.consumerAssignor : defaults.classicAssignor;
  consumerEntries.push({
    id: id,
    expanded: true,
    name: name,
    protocol: protocol,
    assignor: assignor,
    pollTimeoutMs: defaults.pollTimeoutMs,
    pollDelayMs: defaults.pollDelayMs,
    maxPollIntervalMs: defaults.maxPollIntervalMs,
    staticMember: defaults.staticMember,
  });
  renderConsumerSections();
  scrollToConsumer(id);
}

function duplicateLastConsumer() {
  if (consumerEntries.length === 0) { addConsumer(); return; }
  var last = consumerEntries[consumerEntries.length - 1];
  var id = nextConsumerId++;
  consumerEntries.push({
    id: id,
    expanded: true,
    name: 'consumer-' + consumerEntries.length,
    protocol: last.protocol,
    assignor: last.assignor,
    pollTimeoutMs: last.pollTimeoutMs,
    pollDelayMs: last.pollDelayMs,
    maxPollIntervalMs: last.maxPollIntervalMs,
    staticMember: last.staticMember,
  });
  renderConsumerSections();
  scrollToConsumer(id);
}

function scrollToConsumer(id) {
  var el = document.getElementById('section-consumer-' + id);
  if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
}

function removeConsumer(id) {
  consumerEntries = consumerEntries.filter(function(e) { return e.id !== id; });
  renderConsumerSections();
}

function toggleConsumerSection(id) {
  var entry = consumerEntries.find(function(e) { return e.id === id; });
  if (entry) entry.expanded = !entry.expanded;
  renderConsumerSections();
}

function onConsumerFieldChange(consumerId, key, value) {
  var entry = consumerEntries.find(function(e) { return e.id === consumerId; });
  if (!entry) return;
  // When the protocol changes, update the assignor to the corresponding default.
  if (key === 'protocol') {
    var defaults = getDefaults();
    entry.assignor = (value === 'consumer') ? defaults.consumerAssignor : defaults.classicAssignor;
  }
  entry[key] = value;
  renderConsumerSections();
}

function getConsumerSummary(entry) {
  var defaults = getDefaults();
  var diffs = [];
  if (entry.assignor) {
    diffs.push('assignor=' + entry.assignor);
  }
  if (parseInt(entry.pollTimeoutMs) !== defaults.pollTimeoutMs) {
    diffs.push('pollTimeout=' + entry.pollTimeoutMs);
  }
  if (parseInt(entry.pollDelayMs) !== defaults.pollDelayMs) {
    diffs.push('pollDelay=' + entry.pollDelayMs);
  }
  if (parseInt(entry.maxPollIntervalMs) !== defaults.maxPollIntervalMs) {
    diffs.push('maxPoll=' + entry.maxPollIntervalMs);
  }
  if (entry.staticMember !== defaults.staticMember) {
    diffs.push('static=' + (entry.staticMember === 'true' ? 'yes' : 'no'));
  }
  return diffs.length > 0 ? diffs.join(', ') : '';
}

function renderConsumerSections() {
  var container = document.getElementById('consumer-sections');
  if (consumerEntries.length === 0) {
    container.innerHTML = '';
    return;
  }

  var html = '';
  consumerEntries.forEach(function(entry) {
    var expandedCls = entry.expanded ? ' expanded' : '';
    var isConsumerProto = entry.protocol === 'consumer';
    var tagCls = isConsumerProto ? 'tag-consumer' : 'tag-classic';
    var tagText = isConsumerProto ? 'consumer' : 'classic';
    var summary = getConsumerSummary(entry);
    var suggestions = ASSIGNOR_SUGGESTIONS[entry.protocol] || ASSIGNOR_SUGGESTIONS.consumer;
    var datalistId = 'assignor-dl-' + entry.id;
    var sectionId = 'section-consumer-' + entry.id;

    html += '<div class="config-section' + expandedCls + '" id="' + sectionId + '">';

    // Toggle bar
    html += '<button class="section-toggle" onclick="toggleConsumerSection(' + entry.id + ')" type="button">';
    html += '<span class="section-chevron">&#9654;</span>';
    html += '<span class="section-title">' + escapeHtml(entry.name) + '</span>';
    html += '<span class="section-tag ' + tagCls + '">' + tagText + '</span>';
    if (!entry.expanded && summary) {
      html += '<span class="section-summary">' + escapeHtml(summary) + '</span>';
    }
    if (consumerEntries.length > 1) {
      html += '<span class="section-remove" onclick="event.stopPropagation(); removeConsumer(' + entry.id + ')" title="Remove consumer">&times;</span>';
    }
    html += '</button>';

    // Body with all fields -- one field per line (no field-row)
    html += '<div class="section-body">';

    // Name
    html += '<div class="field">';
    html += '<label class="field-label">Name</label>';
    html += '<input type="text" class="field-input" value="' + escapeHtml(entry.name) + '"' +
      ' onchange="onConsumerFieldChange(' + entry.id + ', \'name\', this.value)">';
    html += '</div>';

    // Protocol
    html += '<div class="field">';
    html += '<label class="field-label">Protocol</label>';
    html += '<select class="field-input" onchange="onConsumerFieldChange(' + entry.id + ', \'protocol\', this.value)">';
    html += '<option value="consumer"' + (entry.protocol === 'consumer' ? ' selected' : '') + '>consumer</option>';
    html += '<option value="classic"' + (entry.protocol === 'classic' ? ' selected' : '') + '>classic</option>';
    html += '</select>';
    html += '</div>';

    // Assignor (select dropdown)
    html += '<div class="field">';
    html += '<label class="field-label">Assignor</label>';
    html += '<select class="field-input" onchange="onConsumerFieldChange(' + entry.id + ', \'assignor\', this.value)">';
    html += '<option value=""' + (entry.assignor === '' ? ' selected' : '') + '>(default)</option>';
    for (var i = 0; i < suggestions.length; i++) {
      html += '<option value="' + suggestions[i] + '"' + (entry.assignor === suggestions[i] ? ' selected' : '') + '>' + suggestions[i] + '</option>';
    }
    html += '</select>';
    html += '</div>';

    // Poll Timeout
    html += '<div class="field">';
    html += '<label class="field-label">Poll Timeout (ms)</label>';
    html += '<input type="number" class="field-input" value="' + entry.pollTimeoutMs + '" min="0" max="60000"' +
      ' onchange="onConsumerFieldChange(' + entry.id + ', \'pollTimeoutMs\', this.value)">';
    html += '</div>';

    // Poll Delay
    html += '<div class="field">';
    html += '<label class="field-label">Poll Delay (ms)</label>';
    html += '<input type="number" class="field-input" value="' + entry.pollDelayMs + '" min="0" max="120000"' +
      ' onchange="onConsumerFieldChange(' + entry.id + ', \'pollDelayMs\', this.value)">';
    html += '</div>';

    // Max Poll Interval
    html += '<div class="field">';
    html += '<label class="field-label">Max Poll Interval (ms)</label>';
    html += '<input type="number" class="field-input" value="' + entry.maxPollIntervalMs + '" min="1000" max="600000"' +
      ' onchange="onConsumerFieldChange(' + entry.id + ', \'maxPollIntervalMs\', this.value)">';
    html += '</div>';

    // Static Member
    html += '<div class="field">';
    html += '<label class="field-label">Static Member</label>';
    html += '<input type="text" class="field-input" value="' + escapeHtml(entry.staticMember) + '"' +
      ' list="static-member-dl-' + entry.id + '"' +
      ' onchange="onConsumerFieldChange(' + entry.id + ', \'staticMember\', this.value)">';
    html += '<datalist id="static-member-dl-' + entry.id + '">';
    html += '<option value="false"><option value="true">';
    html += '</datalist>';
    html += '</div>';

    html += '</div></div>';
  });

  container.innerHTML = html;
}

// -- Collect per-consumer configs for logging --
function collectConsumerConfigs() {
  return consumerEntries.map(function(entry, idx) {
    return {
      index: idx,
      name: entry.name,
      protocol: entry.protocol,
      assignor: entry.assignor,
      pollTimeoutMs: parseInt(entry.pollTimeoutMs),
      pollDelayMs: parseInt(entry.pollDelayMs),
      maxPollIntervalMs: parseInt(entry.maxPollIntervalMs),
      staticMember: entry.staticMember === 'true' || entry.staticMember === true,
    };
  });
}

// -- Simulation lifecycle --

function toggleSimulation() {
  if (simulationRunning) {
    stopSimulation();
  } else {
    startSimulation();
  }
}

function setSimulationUI(running) {
  simulationRunning = running;
  var configMode = document.getElementById('config-mode');
  var btn = document.getElementById('btn-start-sim');
  var autopilotBtn = document.getElementById('btn-autopilot-config');

  if (running) {
    configMode.classList.add('locked');
    btn.textContent = 'Stop';
    btn.className = 'btn btn-stop';
    btn.disabled = false;
    autopilotBtn.disabled = false;
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('view-wrapper').style.display = '';
  } else {
    configMode.classList.remove('locked');
    btn.textContent = 'Start';
    btn.className = 'btn btn-start';
    btn.disabled = false;
    autopilotBtn.disabled = true;
    autopilotBtn.className = 'btn btn-autopilot';
    document.getElementById('empty-state').style.display = '';
    document.getElementById('view-wrapper').style.display = 'none';
    document.getElementById('card-grid').innerHTML = '';
    updateStatus(null);
  }
}

function updateStatus(data) {
  var stateEl = document.getElementById('status-state');
  var typeEl = document.getElementById('status-type');
  var epochEl = document.getElementById('status-epoch');
  var targetEl = document.getElementById('status-target-epoch');
  var generationEl = document.getElementById('status-generation');
  var epochItem = document.getElementById('status-item-epoch');
  var targetItem = document.getElementById('status-item-target');
  var generationItem = document.getElementById('status-item-generation');

  if (!data || !data.groupState) {
    stateEl.textContent = simulationRunning ? 'STARTING' : 'IDLE';
    stateEl.className = 'status-badge s-idle';
    typeEl.textContent = '\u2014';
    epochEl.textContent = '\u2014';
    targetEl.textContent = '\u2014';
    generationEl.textContent = '\u2014';
    epochItem.style.display = '';
    targetItem.style.display = '';
    generationItem.style.display = 'none';
    return;
  }

  var rawGs = data.groupState || 'UNKNOWN';
  var gs = rawGs.replace(/([a-z])([A-Z])/g, '$1 $2').toUpperCase();
  var badgeCls = 's-empty';
  if (rawGs === 'Stable') badgeCls = 's-stable';
  else if (rawGs === 'Reconciling' || rawGs === 'Assigning' ||
           rawGs === 'PreparingRebalance' || rawGs === 'CompletingRebalance') badgeCls = 's-reconciling';

  stateEl.textContent = gs;
  stateEl.className = 'status-badge ' + badgeCls;

  var gtype = data.groupType || '\u2014';
  typeEl.textContent = gtype.toUpperCase();

  var isClassic = gtype.toLowerCase() === 'classic';
  if (isClassic) {
    epochItem.style.display = 'none';
    targetItem.style.display = 'none';
    generationItem.style.display = '';
    generationEl.textContent = (data.groupGeneration != null && data.groupGeneration >= 0)
      ? data.groupGeneration : '\u2014';
  } else {
    epochItem.style.display = '';
    targetItem.style.display = '';
    generationItem.style.display = 'none';
    epochEl.textContent = (data.groupEpoch != null && data.groupEpoch >= 0) ? data.groupEpoch : '\u2014';
    targetEl.textContent = (data.targetAssignmentEpoch != null && data.targetAssignmentEpoch >= 0) ? data.targetAssignmentEpoch : '\u2014';
  }
}

async function startSimulation() {
  if (consumerEntries.length === 0) {
    alert('Add at least one consumer before starting.');
    return;
  }

  var btn = document.getElementById('btn-start-sim');
  btn.disabled = true;
  btn.textContent = 'Starting...';

  // Collect per-consumer configs and log them.
  var perConsumerConfigs = collectConsumerConfigs();
  console.log('[Kaos] Per-consumer configs:', JSON.stringify(perConsumerConfigs, null, 2));

  // Use group ID as topic prefix.
  var groupId = document.getElementById('cfg-group-id').value;

  // Build config with per-consumer array.
  var first = consumerEntries[0];
  var config = {
    groupId: groupId,
    topicPrefix: groupId,
    numTopics: parseInt(document.getElementById('cfg-num-topics').value),
    numPartitions: parseInt(document.getElementById('cfg-num-partitions').value),
    numConsumers: consumerEntries.length,
    sessionTimeoutMs: parseInt(document.getElementById('cfg-session-timeout').value),
    heartbeatIntervalMs: parseInt(document.getElementById('cfg-heartbeat-interval').value),
    assignmentIntervalMs: parseInt(document.getElementById('cfg-assignment-interval').value),
    // Defaults (used as fallback).
    protocol: first.protocol,
    assignor: first.assignor,
    pollTimeoutMs: parseInt(first.pollTimeoutMs),
    pollDelayMs: parseInt(first.pollDelayMs),
    maxPollIntervalMs: parseInt(first.maxPollIntervalMs),
    staticMembers: first.staticMember === 'true',
    // Per-consumer configs.
    consumers: perConsumerConfigs.map(function(c) {
      return {
        protocol: c.protocol,
        assignor: c.assignor,
        pollTimeoutMs: parseInt(c.pollTimeoutMs),
        pollDelayMs: parseInt(c.pollDelayMs),
        maxPollIntervalMs: parseInt(c.maxPollIntervalMs),
        staticMember: c.staticMember === 'true'
      };
    })
  };

  try {
    var resp = await fetch('/api/simulator/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(config)
    });
    if (!resp.ok) {
      var err = await resp.json();
      alert('Failed to start: ' + (err.error || resp.statusText));
      btn.disabled = false;
      btn.textContent = 'Start';
      return;
    }
    currentConfig = config;
    prevState = null;
    prevCtrlState = {};
    setSimulationUI(true);
    startPolling();
  } catch (e) {
    alert('Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Start';
  }
}

async function stopSimulation() {
  var btn = document.getElementById('btn-start-sim');
  btn.disabled = true;
  btn.textContent = 'Stopping\u2026';
  stopPolling();
  try {
    await fetch('/api/simulator/stop', {method: 'POST'});
  } catch (e) { /* ignore */ }
  autopilotRunning = false;
  prevState = null;
  setSimulationUI(false);
}

async function toggleAutopilot() {
  var btn = document.getElementById('btn-autopilot-config');
  if (autopilotRunning) {
    await fetch('/api/simulator/chaos/stop', {method: 'POST'});
    autopilotRunning = false;
    btn.className = 'btn btn-autopilot';
  } else {
    await fetch('/api/simulator/chaos/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({intervalMinMs: 10000, intervalMaxMs: 30000})
    });
    autopilotRunning = true;
    btn.className = 'btn btn-autopilot active';
  }
}

function startPolling() {
  pollInterval = setInterval(pollGroup, 200);
  pollGroup();
}

function stopPolling() {
  if (pollInterval) {
    clearInterval(pollInterval);
    pollInterval = null;
  }
}

async function pollGroup() {
  try {
    var resp = await fetch('/api/simulator/group');
    var data = await resp.json();
    if (data.phase !== 'RUNNING') return;
    updateStatus(data);
    renderGroup(data);
    prevState = data;
  } catch (e) { /* ignore */ }
}

function splitPartitionKey(key) {
  var lastDash = key.lastIndexOf('-');
  return [key.substring(0, lastDash), key.substring(lastDash + 1)];
}

// -- Rendering: bento cards --

function badgeClassFor(state) {
  if (state === 'Stable') return 'stable';
  if (state === 'Reconciling') return 'reconciling';
  if (state === 'Stopping') return 'stopping';
  if (state === 'Joining') return 'joining';
  return 'stopped';
}

function renderGroup(data) {
  if (!currentConfig) return;

  var topics = [];
  for (var i = 1; i <= currentConfig.numTopics; i++) {
    topics.push(currentConfig.topicPrefix + '-' + i);
  }
  var numPartitions = currentConfig.numPartitions;
  var isClassic = (data.groupType || '').toLowerCase() === 'classic';
  var partitionLag = data.partitionLag || {};

  var grid = document.getElementById('card-grid');
  var members = (data.members || []).slice().sort(function(a, b) { return a.slotIndex - b.slotIndex; });

  var validIds = new Set();

  for (var mi = 0; mi < members.length; mi++) {
    var m = members[mi];
    var cardId = 'card-' + m.slotIndex;
    validIds.add(cardId);
    var card = document.getElementById(cardId);

    if (!card) {
      card = document.createElement('div');
      card.id = cardId;
      card.className = 'card';
      card.innerHTML =
        '<div class="card-meta">' +
          '<div class="card-meta-row">' +
            '<span class="member-name"></span>' +
            '<span class="badge"></span>' +
          '</div>' +
          '<div class="meta-line meta-line-protocol">' +
            '<span class="meta-line-label">protocol</span>' +
            '<span class="meta-line-value"></span>' +
          '</div>' +
          '<div class="meta-line meta-line-id">' +
            '<span class="meta-line-label">id</span>' +
            '<span class="meta-line-value"></span>' +
          '</div>' +
          '<div class="meta-line meta-line-instance">' +
            '<span class="meta-line-label">instance</span>' +
            '<span class="meta-line-value"></span>' +
          '</div>' +
          '<div class="meta-line meta-line-epoch">' +
            '<span class="meta-line-label">epoch</span>' +
            '<span class="meta-line-value"></span>' +
          '</div>' +
        '</div>' +
        '<div class="zones"></div>' +
        '<div class="member-controls"></div>';
      grid.appendChild(card);
    }

    var isStopped = m.state === 'Stopped';
    var bCls = badgeClassFor(m.state);
    var memberIsClassic = m.protocol === 'classic';

    card.className = 'card ' + bCls + (isStopped ? ' stopped' : '');

    var nameEl = card.querySelector('.member-name');
    var badgeEl = card.querySelector('.badge');
    var protocolValEl = card.querySelector('.meta-line-protocol .meta-line-value');
    var idValEl = card.querySelector('.meta-line-id .meta-line-value');
    var instanceValEl = card.querySelector('.meta-line-instance .meta-line-value');
    var epochValEl = card.querySelector('.meta-line-epoch .meta-line-value');

    if (nameEl.textContent !== m.clientId) nameEl.textContent = m.clientId;

    var protoTxt = m.protocol || '\u2014';
    if (protocolValEl.textContent !== protoTxt) protocolValEl.textContent = protoTxt;

    if (memberIsClassic) {
      badgeEl.style.display = 'none';
      card.querySelector('.meta-line-epoch').style.display = 'none';
    } else {
      badgeEl.style.display = '';
      if (badgeEl.textContent !== m.state) {
        badgeEl.textContent = m.state;
        badgeEl.className = 'badge ' + bCls;
      }
      card.querySelector('.meta-line-epoch').style.display = '';
      var epochTxt = (m.memberEpoch >= 0 ? String(m.memberEpoch) : '\u2014');
      if (epochValEl.textContent !== epochTxt) {
        epochValEl.textContent = epochTxt;
        epochValEl.className = 'meta-line-value' + (m.memberEpoch >= 0 ? '' : ' dim');
      }
    }

    var idTxt = m.memberId || '\u2014';
    if (idValEl.textContent !== idTxt) {
      idValEl.textContent = idTxt;
      idValEl.className = 'meta-line-value' + (m.memberId ? '' : ' dim');
    }

    var instanceTxt = m.instanceId || '\u2014';
    if (instanceValEl.textContent !== instanceTxt) {
      instanceValEl.textContent = instanceTxt;
      instanceValEl.className = 'meta-line-value' + (m.instanceId ? '' : ' dim');
    }

    // Zones
    var coordCurrent = new Set(m.assignment || []);
    var coordTarget = new Set(m.targetAssignment || []);
    var consumerLocal = new Set(m.localAssignment || []);

    var serverByTopic = {};
    var consumerByTopic = {};
    var serverCount = 0;
    var consumerCount = 0;

    for (var ti = 0; ti < topics.length; ti++) {
      serverByTopic[topics[ti]] = [];
      consumerByTopic[topics[ti]] = [];
    }

    for (var ti2 = 0; ti2 < topics.length; ti2++) {
      var t = topics[ti2];
      for (var p = 0; p < numPartitions; p++) {
        var key = t + '-' + p;
        var inCurrent = coordCurrent.has(key);
        var inTarget = coordTarget.has(key);
        var inLocal = consumerLocal.has(key);
        var lag = partitionLag[key];
        if (inCurrent && inTarget) {
          serverByTopic[t].push({p: p, cls: 'assigned', lag: lag});
          serverCount++;
        } else if (inTarget) {
          serverByTopic[t].push({p: p, cls: 'pending-assignment', lag: lag});
          serverCount++;
        } else if (inCurrent) {
          serverByTopic[t].push({p: p, cls: 'pending-revocation', lag: lag});
          serverCount++;
        }
        if (inLocal) {
          consumerByTopic[t].push({p: p, cls: 'assigned'});
          consumerCount++;
        }
      }
    }

    var zonesEl = card.querySelector('.zones');

    var zonesKey = serverCount + '|' + consumerCount + '|' + topics.map(function(t) {
      return t + ':' + serverByTopic[t].map(function(c) { return c.p + c.cls[0] + (c.lag != null ? 'L' + c.lag : ''); }).join(',') +
        ':' + consumerByTopic[t].map(function(c) { return c.p; }).join(',');
    }).join('|');

    if (zonesEl.dataset.key !== zonesKey) {
      zonesEl.dataset.key = zonesKey;
      zonesEl.innerHTML = buildZonesGrid(topics, serverByTopic, consumerByTopic, serverCount, consumerCount);
    }

    // Controls
    var ctrlDiv = card.querySelector('.member-controls');
    var ctrlKey = m.subscribed + '|' + m.blocked + '|' + m.partitioned + '|' + m.protocol;
    var dis = !m.subscribed ? ' disabled' : '';

    if (ctrlKey !== prevCtrlState[m.slotIndex]) {
      prevCtrlState[m.slotIndex] = ctrlKey;
      var ctrlHtml = '';
      if (m.subscribed) {
        ctrlHtml += '<button class="ctrl-btn act-stop" onclick="stopConsumer(' + m.slotIndex + ')">stop</button>';
      } else {
        ctrlHtml += '<button class="ctrl-btn act-start" onclick="startConsumer(' + m.slotIndex + ')">start</button>';
      }
      if (m.protocol === 'classic') {
        ctrlHtml += '<button class="ctrl-btn act-start"' + dis + ' onclick="upgradeConsumer(' + m.slotIndex + ')">upgrade</button>';
      } else {
        ctrlHtml += '<button class="ctrl-btn act-stop"' + dis + ' onclick="downgradeConsumer(' + m.slotIndex + ')">downgrade</button>';
      }
      ctrlHtml += '<button class="ctrl-btn act-fault' + (m.blocked ? ' on' : '') + '"' + dis +
        ' onclick="' + (m.blocked ? 'unblockMember(' : 'blockMember(') + m.slotIndex + ')">' +
        (m.blocked ? 'resume' : 'freeze') + '</button>';
      ctrlHtml += '<button class="ctrl-btn act-fault' + (m.partitioned ? ' on' : '') + '"' + dis +
        ' onclick="' + (m.partitioned ? 'healMember(' : 'partitionMember(') + m.slotIndex + ')">' +
        (m.partitioned ? 'restore' : 'partition') + '</button>';
      ctrlDiv.innerHTML = ctrlHtml;
    }
  }

  // Remove stale cards.
  for (var ci = grid.children.length - 1; ci >= 0; ci--) {
    var child = grid.children[ci];
    if (!validIds.has(child.id)) {
      grid.removeChild(child);
      var match = child.id.match(/^card-(\d+)$/);
      if (match) {
        delete prevCtrlState[parseInt(match[1])];
      }
    }
  }
}

function lagIntensity(lag) {
  if (lag == null || lag < 10) return 0;
  return Math.min(1.0, (lag - 10) / 90);
}

function lagStyle(cls, lag) {
  var t = lagIntensity(lag);
  if (t === 0 && lag != null) return '';
  if (lag == null) return '';

  var bgAlphaMin = 0.12, bgAlphaMax = 0.55;
  var borderAlphaMin = 0.25, borderAlphaMax = 0.7;
  var bgAlpha = (bgAlphaMin + t * (bgAlphaMax - bgAlphaMin)).toFixed(3);
  var borderAlpha = (borderAlphaMin + t * (borderAlphaMax - borderAlphaMin)).toFixed(3);

  if (cls === 'assigned') {
    return 'background:rgba(52,211,153,' + bgAlpha + ');border-color:rgba(52,211,153,' + borderAlpha + ');';
  } else if (cls === 'pending-assignment') {
    return 'background:rgba(76,154,255,' + bgAlpha + ');border-color:rgba(76,154,255,' + borderAlpha + ');';
  } else if (cls === 'pending-revocation') {
    return 'background:rgba(251,191,36,' + bgAlpha + ');border-color:rgba(251,191,36,' + borderAlpha + ');';
  }
  return '';
}

function buildZonesGrid(topics, serverByTopic, consumerByTopic, serverCount, consumerCount) {
  var html = '';

  html += '<div class="zone-cell zone-header zone-cell-name"></div>';
  html += '<div class="zone-cell zone-header zone-cell-server">' +
    '<span class="zone-label">Coordinator view</span>' +
    '<span class="zone-count">' + serverCount + ' part' + (serverCount === 1 ? '' : 's') + '</span>' +
    '</div>';
  html += '<div class="zone-cell zone-header zone-cell-consumer">' +
    '<span class="zone-label">Consumer view</span>' +
    '<span class="zone-count">' + consumerCount + ' part' + (consumerCount === 1 ? '' : 's') + '</span>' +
    '</div>';

  for (var ti = 0; ti < topics.length; ti++) {
    var t = topics[ti];
    html += '<div class="zone-cell zone-row zone-cell-name">' +
      '<span class="zone-topic-name" title="' + escapeHtml(t) + '">' + escapeHtml(t) + '</span>' +
      '</div>';

    html += '<div class="zone-cell zone-row zone-cell-server"><div class="zone-chips">';
    for (var si = 0; si < serverByTopic[t].length; si++) {
      var c = serverByTopic[t][si];
      var style = lagStyle(c.cls, c.lag);
      var title = c.lag != null ? ' data-lag="' + c.lag + '"' : '';
      html += '<span class="partition-chip ' + c.cls + '"' + title +
        (style ? ' style="' + style + '"' : '') + '>' + c.p + '</span>';
    }
    html += '</div></div>';

    html += '<div class="zone-cell zone-row zone-cell-consumer"><div class="zone-chips">';
    for (var ci2 = 0; ci2 < consumerByTopic[t].length; ci2++) {
      var c2 = consumerByTopic[t][ci2];
      html += '<span class="partition-chip ' + c2.cls + '">' + c2.p + '</span>';
    }
    html += '</div></div>';
  }

  return html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// -- Member control handlers --

async function startConsumer(index) {
  await fetch('/api/simulator/members/' + index + '/subscribe', {method: 'POST'});
}

async function stopConsumer(index) {
  await fetch('/api/simulator/members/' + index + '/unsubscribe', {method: 'POST'});
}

async function upgradeConsumer(index) {
  await fetch('/api/simulator/members/' + index + '/upgrade', {method: 'POST'});
}

async function downgradeConsumer(index) {
  await fetch('/api/simulator/members/' + index + '/downgrade', {method: 'POST'});
}

async function partitionMember(index) {
  await fetch('/api/simulator/members/' + index + '/partition', {method: 'POST'});
}

async function healMember(index) {
  await fetch('/api/simulator/members/' + index + '/heal', {method: 'POST'});
}

async function blockMember(index) {
  await fetch('/api/simulator/members/' + index + '/block', {method: 'POST'});
}

async function unblockMember(index) {
  await fetch('/api/simulator/members/' + index + '/unblock', {method: 'POST'});
}

// -- Init: auto-add 4 consumers, check if already running --
(async function() {
  // Start with zero consumers — user adds what they need.
  renderConsumerSections();

  try {
    var resp = await fetch('/api/simulator/status');
    var data = await resp.json();
    if (data.phase === 'RUNNING') {
      currentConfig = data.config;
      if (currentConfig) {
        document.getElementById('cfg-group-id').value = currentConfig.groupId || '';
        document.getElementById('cfg-num-topics').value = currentConfig.numTopics || '';
        document.getElementById('cfg-num-partitions').value = currentConfig.numPartitions || '';
        document.getElementById('cfg-session-timeout').value = currentConfig.sessionTimeoutMs || 45000;
        document.getElementById('cfg-heartbeat-interval').value = currentConfig.heartbeatIntervalMs || 5000;
        document.getElementById('cfg-assignment-interval').value = currentConfig.assignmentIntervalMs || 1000;
        // Restore consumer count from running config.
        var numConsumers = currentConfig.numConsumers || 4;
        consumerEntries = [];
        nextConsumerId = 0;
        for (var j = 0; j < numConsumers; j++) addConsumer();
        renderConsumerSections();
      }
      setSimulationUI(true);
      if (data.chaosRunning) {
        autopilotRunning = true;
        document.getElementById('btn-autopilot-config').className = 'btn btn-autopilot active';
      }
      startPolling();
    }
  } catch (e) { /* ignore */ }
})();
</script>
