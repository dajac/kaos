<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaos — KIP-848 Consumer Group Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e14;
  --surface: #12171f;
  --surface2: #1a2029;
  --surface3: #222a35;
  --border: #2a3342;
  --border-subtle: #1e2736;
  --text: #d4dce8;
  --text-muted: #6b7a8d;
  --text-dim: #4a5568;
  --accent: #4c9aff;
  --accent-dim: rgba(76,154,255,0.12);
  --green: #34d399;
  --green-dim: rgba(52,211,153,0.12);
  --yellow: #fbbf24;
  --yellow-dim: rgba(251,191,36,0.10);
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.10);
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
  --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --sidebar-w: 280px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

/* ── Layout shell ── */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: 1fr auto;
  height: 100vh;
  gap: 0;
}

/* ── Sidebar ── */
.sidebar {
  grid-row: 1 / 3;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

.sidebar-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
}

.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sidebar-header {
  flex: 0 0 auto;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
}

.sidebar-footer {
  flex: 0 0 auto;
  border-top: 1px solid var(--border);
}

.sidebar-brand {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
}

.sidebar-subtitle {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
  letter-spacing: 0.3px;
}

.sidebar-section {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
}

.sidebar-section:last-child {
  border-bottom: none;
}

.section-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-bottom: 10px;
}

/* ── Status line (in main header) ── */
.header-status {
  display: flex;
  align-items: center;
  gap: 12px;
}

.status-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.status-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
}

.status-value {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
}

.status-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.status-badge.s-stable { background: var(--green-dim); color: var(--green); }
.status-badge.s-reconciling, .status-badge.s-assigning { background: var(--yellow-dim); color: var(--yellow); }
.status-badge.s-empty { background: rgba(107,122,141,0.12); color: var(--text-dim); }
.status-badge.s-idle { background: rgba(107,122,141,0.12); color: var(--text-dim); }

/* ── Form fields ── */
.field {
  margin-bottom: 8px;
}

.field:last-child { margin-bottom: 0; }

.field-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 3px;
  letter-spacing: 0.3px;
}

.field-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-family: var(--font-mono);
  transition: border-color 0.15s;
}

.field-input:focus {
  outline: none;
  border-color: var(--accent);
}

.field-input:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  background: var(--surface2);
}

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  border: none;
  cursor: pointer;
  transition: opacity 0.12s, background 0.12s;
  width: 100%;
}

.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn:active { transform: scale(0.98); }

.btn-start {
  background: var(--green);
  color: #0a0e14;
}

.btn-stop {
  background: var(--red);
  color: #0a0e14;
}

/* ── Auto-Pilot ── */
.btn-autopilot {
  width: 100%;
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--text-muted);
}

.btn-autopilot:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.btn-autopilot.active {
  background: var(--yellow-dim);
  border-color: rgba(251,191,36,0.3);
  color: var(--yellow);
}

/* ── Main area ── */
.main {
  overflow: auto;
  padding: 0;
  background: var(--bg);
}

.main::-webkit-scrollbar { width: 6px; height: 6px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Matrix table ── */
.matrix-table {
  border-collapse: collapse;
  width: 100%;
  table-layout: fixed;
  font-family: var(--font-mono);
  font-size: 11px;
}

.matrix-table th,
.matrix-table td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--border-subtle);
  border-right: 1px solid var(--border-subtle);
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
}

.matrix-table th {
  background: var(--surface);
  color: var(--text-dim);
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  position: sticky;
  top: 0;
  z-index: 2;
  border-bottom: 1px solid var(--border);
}

.matrix-table th.member-col-header {
  text-align: left;
  width: 400px;
  min-width: 400px;
  max-width: 400px;
  position: sticky;
  left: 0;
  z-index: 3;
}

.matrix-table td.member-info {
  text-align: left;
  vertical-align: middle;
  background: var(--surface);
  width: 400px;
  min-width: 400px;
  max-width: 400px;
  overflow: hidden;
  position: sticky;
  left: 0;
  z-index: 1;
  border-right: 1px solid var(--border);
  padding: 0;
}

.matrix-table td.member-info.stopped-row {
  opacity: 0.45;
}

.member-cell-layout {
  display: flex;
  align-items: stretch;
}

/* ── Left: server state ── */
.member-state {
  flex: 1;
  padding: 6px 8px;
  min-width: 0;
}

.member-header {
  display: flex;
  align-items: center;
  gap: 6px;
}

.member-name {
  font-weight: 600;
  font-size: 12px;
  color: var(--text);
}

.badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  flex-shrink: 0;
}

.badge.stable { background: var(--green-dim); color: var(--green); }
.badge.reconciling { background: var(--yellow-dim); color: var(--yellow); }
.badge.stopping { background: var(--red-dim); color: var(--red); }
.badge.stopped { background: rgba(107,122,141,0.1); color: var(--text-dim); }
.badge.joining { background: var(--accent-dim); color: var(--accent); }

.member-detail {
  font-size: 9px;
  color: var(--text-dim);
  margin-top: 1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── Right: controls stack ── */
.member-controls {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 4px;
  border-left: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.ctrl-delay {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
}

.ctrl-delay.disabled {
  opacity: 0.3;
}

.ctrl-delay-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.3px;
}

.ctrl-delay-input {
  width: 50px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 9px;
  font-family: var(--font-mono);
  font-weight: 600;
  text-align: left;
}

.ctrl-delay-input:focus {
  outline: none;
  border-color: var(--accent);
}

.ctrl-delay-unit {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
}

.ctrl-btn {
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
  white-space: nowrap;
  text-align: center;
  min-width: 82px;
}

.ctrl-btn:hover { background: var(--surface3); color: var(--text); }
.ctrl-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  pointer-events: none;
}

.ctrl-btn.act-start { color: var(--green); border-color: rgba(52,211,153,0.3); }
.ctrl-btn.act-stop { color: var(--red); border-color: rgba(248,113,113,0.3); }

.ctrl-btn.act-block-poll { color: var(--text-muted); border-color: var(--border); }
.ctrl-btn.act-block-poll.on {
  color: var(--yellow);
  border-color: rgba(251,191,36,0.4);
  background: var(--yellow-dim);
}

.ctrl-btn.act-block-net { color: var(--text-muted); border-color: var(--border); }
.ctrl-btn.act-block-net.on {
  color: var(--red);
  border-color: rgba(248,113,113,0.4);
  background: var(--red-dim);
}

/* ── Partition cells ── */
.matrix-cell {
  vertical-align: top;
  white-space: normal;
  padding: 0 !important;
  height: 1px; /* needed so .cell-split height:100% can stretch to row height */
}

.matrix-cell.stopped-row {
  opacity: 0.25;
}

.cell-split {
  display: flex;
  align-items: stretch;
  gap: 0;
  height: 100%;
  min-height: 100%;
}

.cell-side {
  flex: 1 1 50%;
  min-width: 0;
  min-height: 22px;
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 3px;
  padding: 6px;
}

.cell-side-server {
  border-right: 1px solid var(--border-subtle);
}

.matrix-table th.topic-header {
  padding: 0;
  min-width: 600px;
}

.topic-header-name {
  padding: 6px 8px 4px;
  border-bottom: 1px solid var(--border-subtle);
  text-align: center;
}

.topic-header-subs {
  display: flex;
}

.topic-header-sub {
  flex: 1 1 50%;
  padding: 4px 8px;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.topic-header-sub + .topic-header-sub {
  border-left: 1px solid var(--border-subtle);
}

.partition-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 22px;
  padding: 0;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-mono);
  flex: 0 0 auto;
  transition: background 0.2s, color 0.2s;
}

.partition-chip.assigned {
  background: var(--green-dim);
  color: var(--green);
}

.partition-chip.pending-assignment {
  background: var(--accent-dim);
  color: var(--accent);
}

.partition-chip.pending-revocation {
  background: var(--yellow-dim);
  color: var(--yellow);
}

/* ── Console ── */
.console {
  grid-column: 2;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 10px;
  overflow-y: auto;
  height: 160px;
  min-height: 100px;
}

.console::-webkit-scrollbar { width: 4px; }
.console::-webkit-scrollbar-track { background: transparent; }
.console::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.console-header {
  position: sticky;
  top: 0;
  background: var(--surface);
  padding: 6px 12px;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.console-body {
  padding: 4px 12px 8px;
}

.log-entry {
  padding: 1px 0;
  color: var(--text-muted);
  white-space: pre-wrap;
  line-height: 1.6;
}

.log-entry .log-time {
  color: var(--text-dim);
  margin-right: 8px;
}

.log-entry.log-join { color: var(--green); }
.log-entry.log-leave { color: var(--red); }
.log-entry.log-state { color: var(--yellow); }
.log-entry.log-group { color: var(--accent); }

/* ── Legend (inline in main header area) ── */
.main-header {
  position: sticky;
  top: 0;
  z-index: 4;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.legend {
  display: flex;
  gap: 14px;
  margin-left: auto;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
}

.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 2px;
}

/* ── Empty state ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-dim);
  gap: 8px;
}

.empty-state-icon {
  font-size: 32px;
  opacity: 0.3;
}

.empty-state-text {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.5px;
}

/* ── Resize handle ── */
.resize-handle {
  grid-column: 2;
  height: 4px;
  background: transparent;
  cursor: ns-resize;
  position: relative;
  z-index: 5;
}

.resize-handle:hover,
.resize-handle.active {
  background: var(--accent);
  opacity: 0.4;
}
</style>
</head>
<body>

<div class="app">
  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">Kaos</div>
      <div class="sidebar-subtitle">KIP-848 Consumer Group Simulator</div>
    </div>

    <div class="sidebar-scroll">
    <!-- Setup -->
    <div class="sidebar-section">
      <div class="section-label">Setup</div>
      <div class="field">
        <label class="field-label">Group ID</label>
        <input class="field-input" type="text" id="cfg-group-id" value="simulator-group">
      </div>
      <div class="field">
        <label class="field-label">Topic Prefix</label>
        <input class="field-input" type="text" id="cfg-topic-prefix" value="kaos">
      </div>
      <div class="field">
        <label class="field-label">Topics</label>
        <input class="field-input" type="number" id="cfg-num-topics" value="2" min="1" max="20">
      </div>
      <div class="field">
        <label class="field-label">Partitions</label>
        <input class="field-input" type="number" id="cfg-num-partitions" value="18" min="1" max="100">
      </div>
      <div class="field">
        <label class="field-label">Consumers</label>
        <input class="field-input" type="number" id="cfg-num-consumers" value="6" min="1" max="20">
      </div>
    </div>

    <!-- Group -->
    <div class="sidebar-section">
      <div class="section-label">Group</div>
      <div class="field">
        <label class="field-label">Session Timeout (ms)</label>
        <input class="field-input" type="number" id="cfg-session-timeout" value="45000" min="1000" max="300000">
      </div>
      <div class="field">
        <label class="field-label">Heartbeat Interval (ms)</label>
        <input class="field-input" type="number" id="cfg-heartbeat-interval" value="5000" min="500" max="60000">
      </div>
      <div class="field">
        <label class="field-label">Assignment Interval (ms)</label>
        <input class="field-input" type="number" id="cfg-assignment-interval" value="1000" min="0" max="60000">
      </div>
    </div>

    <!-- Consumer -->
    <div class="sidebar-section">
      <div class="section-label">Consumer</div>
      <div class="field">
        <label class="field-label">Assignor</label>
        <select class="field-input" id="cfg-assignor">
          <option value="">(default)</option>
          <option value="uniform">uniform</option>
          <option value="range">range</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Max Poll Interval (ms)</label>
        <input class="field-input" type="number" id="cfg-max-poll-interval" value="300000" min="1000" max="600000">
      </div>
      <div class="field">
        <label class="field-label">Static Members</label>
        <select class="field-input" id="cfg-static-members">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </div>
    </div>

    </div>

    <div class="sidebar-footer">
      <div class="sidebar-section">
        <button class="btn btn-start" id="btn-start" onclick="startSimulation()">Start</button>
        <button class="btn btn-autopilot" id="btn-autopilot" onclick="toggleAutopilot()" disabled style="margin-top:6px;">Auto-Pilot</button>
      </div>
    </div>
  </aside>

  <!-- ── Main: matrix ── -->
  <main class="main" id="main-area">
    <div class="empty-state" id="empty-state">
      <div class="empty-state-icon">&#9654;</div>
      <div class="empty-state-text">Configure and start a simulation</div>
    </div>
    <div id="matrix-wrapper" style="display:none;">
      <div class="main-header" id="main-header">
        <div class="header-status">
          <span id="status-state" class="status-badge s-idle">IDLE</span>
          <span class="status-item"><span class="status-label">epoch</span> <span id="status-epoch" class="status-value">&mdash;</span></span>
          <span class="status-item"><span class="status-label">target</span> <span id="status-target-epoch" class="status-value">&mdash;</span></span>
        </div>
        <div class="legend">
          <div class="legend-item">
            <div class="legend-swatch" style="background:var(--green-dim);"></div> Assigned
          </div>
          <div class="legend-item">
            <div class="legend-swatch" style="background:var(--accent-dim);"></div> Pending
          </div>
          <div class="legend-item">
            <div class="legend-swatch" style="background:var(--yellow-dim);"></div> Revoking
          </div>
        </div>
      </div>
      <table class="matrix-table" id="matrix-table">
        <thead id="matrix-head"></thead>
        <tbody id="matrix-body"></tbody>
      </table>
    </div>
  </main>

  <!-- ── Console ── -->
  <div class="console" id="console-panel">
    <div class="console-header">
      <span>Event Log</span>
    </div>
    <div class="console-body" id="console-log"></div>
  </div>
</div>

<script>
let pollInterval = null;
let autopilotRunning = false;
let currentConfig = null;
let prevState = null;
let localDelays = {};
let prevCtrlState = {};
let simulationRunning = false;

const LOCKED_FIELDS = [
  'cfg-group-id', 'cfg-topic-prefix', 'cfg-num-topics', 'cfg-num-partitions',
  'cfg-num-consumers', 'cfg-session-timeout', 'cfg-heartbeat-interval',
  'cfg-assignment-interval', 'cfg-assignor', 'cfg-max-poll-interval', 'cfg-static-members'
];

function lockConfig() {
  LOCKED_FIELDS.forEach(id => document.getElementById(id).disabled = true);
}

function unlockConfig() {
  LOCKED_FIELDS.forEach(id => document.getElementById(id).disabled = false);
}

function setSimulationUI(running) {
  simulationRunning = running;
  const btn = document.getElementById('btn-start');

  if (running) {
    lockConfig();
    btn.textContent = 'Stop';
    btn.className = 'btn btn-stop';
    btn.onclick = stopSimulation;
    btn.disabled = false;
    document.getElementById('btn-autopilot').disabled = false;
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('matrix-wrapper').style.display = '';
  } else {
    unlockConfig();
    btn.textContent = 'Start';
    btn.className = 'btn btn-start';
    btn.onclick = startSimulation;
    btn.disabled = false;
    document.getElementById('btn-autopilot').disabled = true;
    document.getElementById('btn-autopilot').className = 'btn btn-autopilot';
    document.getElementById('empty-state').style.display = '';
    document.getElementById('matrix-wrapper').style.display = 'none';
    document.getElementById('matrix-head').innerHTML = '';
    document.getElementById('matrix-body').innerHTML = '';
    document.getElementById('matrix-head').removeAttribute('data-built');
    updateStatus(null);
  }
}

function updateStatus(data) {
  const stateEl = document.getElementById('status-state');
  const epochEl = document.getElementById('status-epoch');
  const targetEl = document.getElementById('status-target-epoch');

  if (!data || !data.groupState) {
    stateEl.textContent = simulationRunning ? 'STARTING' : 'IDLE';
    stateEl.className = 'status-badge s-idle';
    epochEl.textContent = '\u2014';
    targetEl.textContent = '\u2014';
    return;
  }

  const gs = (data.groupState || 'UNKNOWN').toUpperCase();
  let badgeCls = 's-empty';
  if (gs === 'STABLE') badgeCls = 's-stable';
  else if (gs === 'RECONCILING' || gs === 'ASSIGNING') badgeCls = 's-reconciling';

  stateEl.textContent = gs;
  stateEl.className = 'status-badge ' + badgeCls;
  epochEl.textContent = data.groupEpoch ?? '\u2014';
  targetEl.textContent = data.targetAssignmentEpoch ?? '\u2014';
}

async function startSimulation() {
  const btn = document.getElementById('btn-start');
  btn.disabled = true;
  btn.textContent = 'Starting\u2026';

  const config = {
    groupId: document.getElementById('cfg-group-id').value,
    topicPrefix: document.getElementById('cfg-topic-prefix').value,
    numTopics: parseInt(document.getElementById('cfg-num-topics').value),
    numPartitions: parseInt(document.getElementById('cfg-num-partitions').value),
    numConsumers: parseInt(document.getElementById('cfg-num-consumers').value),
    sessionTimeoutMs: parseInt(document.getElementById('cfg-session-timeout').value),
    heartbeatIntervalMs: parseInt(document.getElementById('cfg-heartbeat-interval').value),
    assignmentIntervalMs: parseInt(document.getElementById('cfg-assignment-interval').value),
    assignor: document.getElementById('cfg-assignor').value,
    maxPollIntervalMs: parseInt(document.getElementById('cfg-max-poll-interval').value),
    defaultProcessingDelayMs: 10000,
    staticMembers: document.getElementById('cfg-static-members').value === 'true'
  };

  try {
    const resp = await fetch('/api/simulator/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(config)
    });
    if (!resp.ok) {
      const err = await resp.json();
      alert('Failed to start: ' + (err.error || resp.statusText));
      btn.disabled = false;
      btn.textContent = 'Start';
      return;
    }
    currentConfig = config;
    prevState = null;
    localDelays = {};
    prevCtrlState = {};
    document.getElementById('console-log').innerHTML = '';
    setSimulationUI(true);
    logEvent('log-group', 'Simulation started');
    startPolling();
  } catch (e) {
    alert('Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Start';
  }
}

async function stopSimulation() {
  const btn = document.getElementById('btn-start');
  btn.disabled = true;
  btn.textContent = 'Stopping\u2026';
  stopPolling();
  try {
    await fetch('/api/simulator/stop', {method: 'POST'});
  } catch (e) { /* ignore */ }
  logEvent('log-group', 'Simulation stopped');
  autopilotRunning = false;
  prevState = null;
  document.getElementById('btn-autopilot').className = 'btn-autopilot';
  setSimulationUI(false);
}

async function toggleAutopilot() {
  const btn = document.getElementById('btn-autopilot');
  if (autopilotRunning) {
    await fetch('/api/simulator/chaos/stop', {method: 'POST'});
    autopilotRunning = false;
    btn.className = 'btn btn-autopilot';
    logEvent('log-group', 'Auto-Pilot off');
  } else {
    await fetch('/api/simulator/chaos/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({intervalMinMs: 10000, intervalMaxMs: 30000})
    });
    autopilotRunning = true;
    btn.className = 'btn btn-autopilot active';
    logEvent('log-group', 'Auto-Pilot on');
  }
}

function startPolling() {
  pollInterval = setInterval(pollGroup, 500);
  pollGroup();
}

function stopPolling() {
  if (pollInterval) {
    clearInterval(pollInterval);
    pollInterval = null;
  }
}

async function pollGroup() {
  try {
    const resp = await fetch('/api/simulator/group');
    const data = await resp.json();
    if (data.phase !== 'RUNNING') return;
    updateStatus(data);
    detectChanges(data);
    renderGroup(data);
    prevState = data;
  } catch (e) { /* ignore */ }
}

// ── Console log ──

function logEvent(cls, message) {
  const log = document.getElementById('console-log');
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + cls;
  const now = new Date();
  const ts = now.toLocaleTimeString('en-US', {hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'});
  entry.innerHTML = '<span class="log-time">' + ts + '</span>' + message;
  log.appendChild(entry);
  const panel = document.getElementById('console-panel');
  panel.scrollTop = panel.scrollHeight;
}

function detectChanges(data) {
  if (!prevState) return;

  if (data.groupState !== prevState.groupState) {
    logEvent('log-state', 'Group state: ' + prevState.groupState + ' \u2192 ' + data.groupState);
  }
  if (data.groupEpoch !== prevState.groupEpoch) {
    logEvent('log-group', 'Group epoch: ' + prevState.groupEpoch + ' \u2192 ' + data.groupEpoch);
  }
  if (data.targetAssignmentEpoch !== prevState.targetAssignmentEpoch) {
    logEvent('log-group', 'Target assignment epoch: ' + prevState.targetAssignmentEpoch + ' \u2192 ' + data.targetAssignmentEpoch);
  }

  const prevMembers = {};
  for (const m of (prevState.members || [])) prevMembers[m.clientId] = m;

  for (const m of (data.members || [])) {
    const prev = prevMembers[m.clientId];
    if (!prev) continue;

    if (m.state !== prev.state) {
      logEvent(m.state === 'Stopped' ? 'log-leave' : 'log-state',
        m.clientId + ': ' + prev.state + ' \u2192 ' + m.state);
    }

    if (!prev.memberId && m.memberId) {
      logEvent('log-join', m.clientId + ' joined (' + m.memberId.substring(0, 12) + '\u2026)');
    }

    if (prev.memberId && !m.memberId) {
      logEvent('log-leave', m.clientId + ' left the group');
    }

    if (m.memberEpoch !== prev.memberEpoch && m.memberEpoch >= 0) {
      logEvent('log-state', m.clientId + ': epoch ' + prev.memberEpoch + ' \u2192 ' + m.memberEpoch);
    }

    const prevAssign = new Set(prev.assignment || []);
    const currAssign = new Set(m.assignment || []);
    const gained = [...currAssign].filter(x => !prevAssign.has(x));
    const lost = [...prevAssign].filter(x => !currAssign.has(x));
    if (gained.length > 0) {
      logEvent('log-join', m.clientId + ' assigned: ' + gained.map(formatPartitionKey).join(', '));
    }
    if (lost.length > 0) {
      logEvent('log-leave', m.clientId + ' revoked: ' + lost.map(formatPartitionKey).join(', '));
    }
  }
}

function formatPartitionKey(key) {
  const [topic, partition] = splitPartitionKey(key);
  return topic + ':' + partition;
}

// ── Rendering ──

function renderGroup(data) {
  if (!currentConfig) return;

  const topics = [];
  for (let i = 1; i <= currentConfig.numTopics; i++) {
    topics.push(currentConfig.topicPrefix + '-' + i);
  }

  const thead = document.getElementById('matrix-head');
  if (!thead.dataset.built) {
    let headHtml = '<tr><th class="member-col-header">Member</th>';
    for (const t of topics) {
      headHtml += '<th class="topic-header">' +
        '<div class="topic-header-name">' + t + '</div>' +
        '<div class="topic-header-subs">' +
          '<div class="topic-header-sub">server</div>' +
          '<div class="topic-header-sub">consumer</div>' +
        '</div></th>';
    }
    headHtml += '</tr>';
    thead.innerHTML = headHtml;
    thead.dataset.built = '1';
  }

  const members = (data.members || []).slice().sort((a, b) => a.slotIndex - b.slotIndex);
  const tbody = document.getElementById('matrix-body');

  for (const m of members) {
    const rowId = 'row-' + m.slotIndex;
    let row = document.getElementById(rowId);
    const isStopped = m.state === 'Stopped';
    const isStable = m.state === 'Stable';
    const isReconciling = m.state === 'Reconciling';

    if (!row) {
      row = document.createElement('tr');
      row.id = rowId;
      tbody.appendChild(row);
    }

    while (row.cells.length < 1 + topics.length) row.insertCell();
    while (row.cells.length > 1 + topics.length) row.deleteCell(row.cells.length - 1);

    // ── Member cell ──
    const memberCell = row.cells[0];
    memberCell.className = 'member-info' + (isStopped ? ' stopped-row' : '');

    const isStopping = m.state === 'Stopping';

    let badgeClass = 'stopped';
    if (isStable) badgeClass = 'stable';
    else if (isReconciling) badgeClass = 'reconciling';
    else if (isStopping) badgeClass = 'stopping';
    else if (m.state === 'Joining') badgeClass = 'joining';

    // Ensure layout wrapper exists.
    let layoutId = 'layout-' + m.slotIndex;
    let layoutDiv = document.getElementById(layoutId);
    if (!layoutDiv) {
      layoutDiv = document.createElement('div');
      layoutDiv.id = layoutId;
      layoutDiv.className = 'member-cell-layout';
      memberCell.innerHTML = '';
      memberCell.appendChild(layoutDiv);
    }

    // Left: server state.
    let infoId = 'info-' + m.slotIndex;
    let infoDiv = document.getElementById(infoId);
    if (!infoDiv) {
      infoDiv = document.createElement('div');
      infoDiv.id = infoId;
      infoDiv.className = 'member-state';
      layoutDiv.appendChild(infoDiv);
    }

    const infoKey = m.state + '|' + m.memberId + '|' + m.memberEpoch;
    if (infoDiv.dataset.key !== infoKey) {
      infoDiv.dataset.key = infoKey;
      let infoHtml = '<div class="member-header"><span class="member-name">' + m.clientId +
        '</span> <span class="badge ' + badgeClass + '">' + m.state + '</span></div>';
      if (m.memberId) {
        infoHtml += '<div class="member-detail">' + m.memberId + '</div>';
      }
      infoHtml += '<div class="member-detail">epoch ' + (m.memberEpoch >= 0 ? m.memberEpoch : '\u2014') + '</div>';
      infoDiv.innerHTML = infoHtml;
    }

    // Right: controls stack.
    let ctrlId = 'ctrl-' + m.slotIndex;
    let ctrlDiv = document.getElementById(ctrlId);
    if (!ctrlDiv) {
      ctrlDiv = document.createElement('div');
      ctrlDiv.id = ctrlId;
      ctrlDiv.className = 'member-controls';
      layoutDiv.appendChild(ctrlDiv);
    }

    const displayDelay = localDelays[m.slotIndex] !== undefined ? localDelays[m.slotIndex] : m.processingDelayMs;
    const ctrlKey = m.subscribed + '|' + m.blocked + '|' + m.partitioned + '|' + displayDelay;
    const dis = !m.subscribed ? ' disabled' : '';

    if (ctrlKey !== prevCtrlState[m.slotIndex]) {
      prevCtrlState[m.slotIndex] = ctrlKey;
      let ctrlHtml = '';

      // Start / Stop.
      if (m.subscribed) {
        ctrlHtml += '<button class="ctrl-btn act-stop" onclick="unsubscribe(' + m.slotIndex + ')">stop</button>';
      } else {
        ctrlHtml += '<button class="ctrl-btn act-start" onclick="subscribe(' + m.slotIndex + ')">start</button>';
      }

      // Block poll / Block network — always shown, disabled when stopped.
      ctrlHtml += '<button class="ctrl-btn act-block-poll' + (m.blocked ? ' on' : '') + '"' + dis +
        ' onclick="' + (m.blocked ? 'unblockMember(' : 'blockMember(') + m.slotIndex + ')">block polling</button>';
      ctrlHtml += '<button class="ctrl-btn act-block-net' + (m.partitioned ? ' on' : '') + '"' + dis +
        ' onclick="' + (m.partitioned ? 'healMember(' : 'partitionMember(') + m.slotIndex + ')">block network</button>';

      // Delay input.
      ctrlHtml += '<div class="ctrl-delay' + (m.subscribed ? '' : ' disabled') + '">';
      ctrlHtml += '<span class="ctrl-delay-label">polling delay</span>';
      ctrlHtml += '<input class="ctrl-delay-input" type="number" min="0" max="120" value="' +
        Math.round(displayDelay / 1000) + '" onchange="onDelayInput(' + m.slotIndex + ', this)"' + dis + '>';
      ctrlHtml += '<span class="ctrl-delay-unit">s</span>';
      ctrlHtml += '</div>';

      ctrlDiv.innerHTML = ctrlHtml;
    }

    // ── Partition cells ──
    // Cell is split vertically:
    //   left side  = server view (current vs target, three states)
    //   right side = consumer view (local from rebalance listener, single state)
    // Each side just shows the chips it has — no alignment between sides.
    const coordCurrent = new Set(m.assignment || []);
    const coordTarget = new Set(m.targetAssignment || []);
    const consumerLocal = new Set(m.localAssignment || []);
    const numPartitions = currentConfig.numPartitions;

    for (let ti = 0; ti < topics.length; ti++) {
      const cell = row.cells[1 + ti];
      cell.className = 'matrix-cell' + (isStopped ? ' stopped-row' : '');

      const topic = topics[ti];

      const serverChips = [];
      const consumerChips = [];
      for (let p = 0; p < numPartitions; p++) {
        const key = topic + '-' + p;
        const inCurrent = coordCurrent.has(key);
        const inTarget = coordTarget.has(key);
        const inLocal = consumerLocal.has(key);

        if (inCurrent && inTarget) serverChips.push({p: p, cls: 'assigned'});
        else if (inTarget) serverChips.push({p: p, cls: 'pending-assignment'});
        else if (inCurrent) serverChips.push({p: p, cls: 'pending-revocation'});

        if (inLocal) consumerChips.push({p: p, cls: 'assigned'});
      }

      const cellKey =
        'S:' + serverChips.map(c => c.p + ':' + c.cls).join(',') +
        '|C:' + consumerChips.map(c => c.p).join(',');
      if (cell.dataset.key !== cellKey) {
        cell.dataset.key = cellKey;
        let html = '<div class="cell-split">';
        html += '<div class="cell-side cell-side-server">';
        for (const c of serverChips) {
          html += '<span class="partition-chip ' + c.cls + '">' + c.p + '</span>';
        }
        html += '</div>';
        html += '<div class="cell-side cell-side-consumer">';
        for (const c of consumerChips) {
          html += '<span class="partition-chip ' + c.cls + '">' + c.p + '</span>';
        }
        html += '</div>';
        html += '</div>';
        cell.innerHTML = html;
      }
    }
  }

  // Remove stale rows.
  const validIds = new Set(members.map(m => 'row-' + m.slotIndex));
  for (let i = tbody.rows.length - 1; i >= 0; i--) {
    if (!validIds.has(tbody.rows[i].id)) {
      tbody.deleteRow(i);
    }
  }
}

// ── Slider handling ──

function onDelayInput(index, input) {
  const seconds = parseInt(input.value) || 0;
  const ms = Math.max(0, Math.min(120000, seconds * 1000));
  localDelays[index] = ms;
  setDelay(index, ms);
}

function splitPartitionKey(key) {
  const lastDash = key.lastIndexOf('-');
  return [key.substring(0, lastDash), key.substring(lastDash + 1)];
}

async function subscribe(index) {
  logEvent('log-join', 'consumer-' + index + ': subscribing\u2026');
  await fetch('/api/simulator/members/' + index + '/subscribe', {method: 'POST'});
}

async function unsubscribe(index) {
  logEvent('log-leave', 'consumer-' + index + ': unsubscribing\u2026');
  await fetch('/api/simulator/members/' + index + '/unsubscribe', {method: 'POST'});
}

async function partitionMember(index) {
  logEvent('log-leave', 'consumer-' + index + ': network partition\u2026');
  await fetch('/api/simulator/members/' + index + '/partition', {method: 'POST'});
}

async function healMember(index) {
  logEvent('log-join', 'consumer-' + index + ': healing partition\u2026');
  await fetch('/api/simulator/members/' + index + '/heal', {method: 'POST'});
}

async function blockMember(index) {
  logEvent('log-state', 'consumer-' + index + ': blocking poll()\u2026');
  await fetch('/api/simulator/members/' + index + '/block', {method: 'POST'});
}

async function unblockMember(index) {
  logEvent('log-state', 'consumer-' + index + ': unblocking poll()\u2026');
  await fetch('/api/simulator/members/' + index + '/unblock', {method: 'POST'});
}

async function setDelay(index, value) {
  logEvent('log-state', 'consumer-' + index + ': delay \u2192 ' + (value / 1000).toFixed(0) + 's');
  await fetch('/api/simulator/members/' + index + '/delay', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({delayMs: value})
  });
}

// ── Init: check if simulation is already running ──
(async function() {
  try {
    const resp = await fetch('/api/simulator/status');
    const data = await resp.json();
    if (data.phase === 'RUNNING') {
      currentConfig = data.config;
      // Populate config fields from running config.
      if (currentConfig) {
        document.getElementById('cfg-group-id').value = currentConfig.groupId || '';
        document.getElementById('cfg-topic-prefix').value = currentConfig.topicPrefix || '';
        document.getElementById('cfg-num-topics').value = currentConfig.numTopics || '';
        document.getElementById('cfg-num-partitions').value = currentConfig.numPartitions || '';
        document.getElementById('cfg-num-consumers').value = currentConfig.numConsumers || '';
        document.getElementById('cfg-session-timeout').value = currentConfig.sessionTimeoutMs || 45000;
        document.getElementById('cfg-heartbeat-interval').value = currentConfig.heartbeatIntervalMs || 5000;
        document.getElementById('cfg-assignment-interval').value = currentConfig.assignmentIntervalMs || 1000;
        document.getElementById('cfg-assignor').value = currentConfig.assignor || '';
        document.getElementById('cfg-max-poll-interval').value = currentConfig.maxPollIntervalMs || 300000;
        document.getElementById('cfg-static-members').value = currentConfig.staticMembers ? 'true' : 'false';
      }
      setSimulationUI(true);
      if (data.chaosRunning) {
        autopilotRunning = true;
        document.getElementById('btn-autopilot').className = 'btn btn-autopilot active';
      }
      startPolling();
    }
  } catch (e) { /* ignore */ }
})();
</script>
